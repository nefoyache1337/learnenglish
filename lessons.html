<style>
:root{
  --bg:#e4e5e2; --surface:#eeefec; --surface-2:#d9dbd7; --border:#c3c6c1;
  --text:#272b2f; --muted:#5a6168; --accent:#a8620a; --accent-text:#ffffff;
  --ok:#2f6b4c; --ok-bg:#d3e3d9; --bad:#9a3f3f; --bad-bg:#ebd5d3;
  --font:"Onest","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d2023; --surface:#272b2f; --surface-2:#32373c; --border:#40464b;
    --text:#e2e4e5; --muted:#9fa6ac; --accent:#f5a524; --accent-text:#2b2b2b;
    --ok:#8fd0ab; --ok-bg:#24372d; --bad:#e49a9a; --bad-bg:#3b2828;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2023; --surface:#272b2f; --surface-2:#32373c; --border:#40464b;
  --text:#e2e4e5; --muted:#9fa6ac; --accent:#f5a524; --accent-text:#2b2b2b;
  --ok:#8fd0ab; --ok-bg:#24372d; --bad:#e49a9a; --bad-bg:#3b2828;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
header{border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.15rem;text-decoration:none}
.right{display:flex;gap:14px;align-items:center}
.back{color:var(--muted);text-decoration:none}
.back:hover{color:var(--text)}
.theme{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer}
h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:40px 0 8px}
h2{font-size:1.5rem;margin:28px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:10px;padding:8px 18px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.lesson{border:1px solid var(--border);background:var(--surface);border-radius:14px;margin-bottom:12px;overflow:hidden}
.lesson summary{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;font-weight:500;list-style:none}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:1.4rem}
.lesson[open] summary::after{content:"\2212"}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:.9rem}
.body{padding:0 18px 20px}
.rule{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.rule p{margin:0 0 6px}.rule p:last-child{margin:0}
h3{font-size:1rem;margin:16px 0 6px}
.ex{margin:0 0 4px;padding-left:20px;color:var(--muted)}
.ex i{color:var(--text)}
.q p{margin:12px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer}
.opts button:hover{background:var(--surface-2)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opts button.ok::after{content:" \2713"}
.opts button.bad::after{content:" \2717"}
.score{margin-top:14px;min-height:1.5em;font-weight:500}
.again{font:inherit;margin-left:10px;border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline}
.lesson summary::after{margin-left:12px}
.badge{margin-left:auto;font-size:.85rem;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 10px}
.badge:empty{border:0;padding:0}
.badge.done{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.spk{font:inherit;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:0 8px;margin-left:8px;cursor:pointer;line-height:1.5}
.spk:hover{background:var(--surface-2)}
.progbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 0;color:var(--muted);font-size:.95rem}
.link{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
.tabs small{opacity:.8;font-size:.8rem;margin-left:4px}
.hint{margin-top:8px;font-size:.92rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
footer{border-top:1px solid var(--border);margin-top:40px;padding:24px 0;color:var(--muted);font-size:.9rem}

.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:6px 0 10px;background:var(--bg)}
.tw table{border-collapse:collapse;width:100%}
.tw th,.tw td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid var(--border);font-size:.85rem}
.tw th{color:var(--muted);font-weight:500;font-size:.9rem;background:var(--surface-2)}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:500}
.when,.mist{margin:0 0 6px;padding-left:20px}
.when li,.mist li{margin-bottom:6px}
.mist .x{color:var(--bad);font-weight:500}
.mist .v{color:var(--ok);font-weight:500}
.extra{margin:0 0 8px;color:var(--muted)}
.ex .tr{color:var(--muted);font-size:.92rem;font-style:normal}
.tip{margin-top:12px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px}

.menu{display:flex;gap:6px;overflow-x:auto;margin-top:0;padding:0 20px 12px}
.menu a{flex:none;text-decoration:none;color:var(--muted);padding:6px 14px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.menu a:hover{color:var(--text);background:var(--surface-2)}
.menu a[aria-current="page"]{color:var(--accent-text);background:var(--accent);border-color:var(--accent)}
@media (min-width:721px){.bar,.menu{max-width:960px}.menu{overflow-x:visible;flex-wrap:wrap;gap:4px}.menu a{padding:6px 12px}}
</style>

{"id": "A1", "name": "Начальный", "d": "Первые конструкции: быть, делать, повторяющиеся действия.", "lessons": [{"t": "Глагол to be", "rule": ["<b>To be</b> — «быть, являться». В русском в настоящем времени этого глагола обычно нет (<i>я студент</i>), а в английском он нужен всегда: <i>I am a student.</i>", "Отрицание — добавляем <b>not</b>. Вопрос — глагол выходит вперёд: <i>Are you ready?</i>"], "tbl": {"head": ["Кто", "Утверждение", "Отрицание", "Вопрос"], "rows": [["I", "I am (I'm)", "I am not (I'm not)", "Am I?"], ["you / we / they", "you are (you're)", "you are not (aren't)", "Are you?"], ["he / she / it", "he is (he's)", "he is not (isn't)", "Is he?"]]}, "when": ["Назвать себя, профессию, возраст: <i>I am a teacher. I am twenty.</i>", "Описать человека или предмет: <i>The room is big.</i>", "Сказать, где кто-то находится: <i>She is at home.</i>"], "ex": [["I am a student.", "Я студент."], ["She is at home.", "Она дома."], ["We are friends.", "Мы друзья."], ["Are they ready?", "Они готовы?"], ["It is not expensive.", "Это недорого."]], "mist": ["<span class=\"x\">✗ She are a doctor.</span> <span class=\"v\">✓ She is a doctor.</span> С he / she / it только is.", "<span class=\"x\">✗ I student.</span> <span class=\"v\">✓ I am a student.</span> Без to be предложение неполное.", "<span class=\"x\">✗ You is late.</span> <span class=\"v\">✓ You are late.</span> С you всегда are, даже когда «ты» — один человек."], "tip": "тройка: I — am, he / she / it — is, остальные (you, we, they) — are.", "q": [{"q": "She ___ from Spain.", "o": ["am", "is", "are"], "a": 1}, {"q": "We ___ friends.", "o": ["is", "am", "are"], "a": 2}, {"q": "___ you a teacher?", "o": ["Am", "Is", "Are"], "a": 2}, {"q": "It ___ cold today.", "o": ["is", "am", "are"], "a": 0}, {"q": "My parents ___ at work.", "o": ["is", "are", "am"], "a": 1}]}, {"t": "Present Simple", "rule": ["Простое настоящее — для того, что происходит регулярно или всегда: привычки, работа, факты, расписания.", "С <b>he / she / it</b> к глаголу добавляем <b>-s</b>: <i>he works</i>. Для отрицания и вопроса нужны <b>do / does</b>."], "tbl": {"head": ["Кто", "Утверждение", "Отрицание", "Вопрос"], "rows": [["I / you / we / they", "I work", "I don't work", "Do you work?"], ["he / she / it", "he works", "he doesn't work", "Does he work?"]]}, "when": ["Привычки и повторяющиеся действия: <i>I get up at seven.</i>", "Постоянные факты и работа: <i>She works in a bank.</i>", "Общеизвестные истины: <i>Water boils at 100 °C.</i>", "Расписания: <i>The train leaves at six.</i>", "Слова-подсказки: always, usually, often, sometimes, never, every day, on Mondays."], "extra": {"t": "Правописание окончания -s", "p": ["После -s, -sh, -ch, -x и у глагола go / do добавляем <b>-es</b>: watch → watches, go → goes. Если глагол оканчивается на согласную + y, меняем y на <b>-ies</b>: study → studies. Но play → plays (перед y гласная)."]}, "ex": [["He drinks coffee every morning.", "Он пьёт кофе каждое утро."], ["They don't like fish.", "Они не любят рыбу."], ["Does she live here?", "Она живёт здесь?"], ["The shop opens at nine.", "Магазин открывается в девять."], ["I never watch TV in the morning.", "Я никогда не смотрю телевизор утром."]], "mist": ["<span class=\"x\">✗ He work every day.</span> <span class=\"v\">✓ He works every day.</span> С he / she / it нужно -s.", "<span class=\"x\">✗ Does he works?</span> <span class=\"v\">✓ Does he work?</span> После do / does глагол без -s.", "<span class=\"x\">✗ She doesn't likes tea.</span> <span class=\"v\">✓ She doesn't like tea.</span> Окончание -s остаётся в does."], "tip": "-s у he / she / it ставим только один раз: либо у глагола, либо у does.", "q": [{"q": "He ___ coffee every morning.", "o": ["drink", "drinks", "drinking"], "a": 1}, {"q": "They ___ like fish.", "o": ["don't", "doesn't", "isn't"], "a": 0}, {"q": "___ she live here?", "o": ["Do", "Does", "Is"], "a": 1}, {"q": "She ___ to school by bus.", "o": ["go", "goes", "going"], "a": 1}, {"q": "My brother ___ like tomatoes.", "o": ["doesn't", "don't", "isn't"], "a": 0}]}, {"t": "Местоимения: кто? и кого? кому?", "rule": ["Местоимения заменяют существительные. У них две «серии»: <b>кто?</b> — подлежащее, стоит перед глаголом (<i>I love her</i>); <b>кого? кому?</b> — дополнение, стоит после глагола или предлога (<i>She loves me</i>).", "В английском подлежащее обязательно: нельзя сказать «Люблю кофе», нужно <i>I love coffee</i>."], "ex": [["She loves me.", "Она любит меня."], ["We see them every day.", "Мы видим их каждый день."], ["Give it to him.", "Дай это ему."], ["He helps us.", "Он помогает нам."], ["Where is Tom? I cannot see him.", "Где Том? Я не вижу его."]], "q": [{"q": "They call ___ every day. (нас)", "o": ["we", "us", "our"], "a": 1}, {"q": "She loves ___. (меня)", "o": ["I", "me", "my"], "a": 1}, {"q": "Where is Tom? I cannot see ___.", "o": ["he", "him", "his"], "a": 1}, {"q": "Tom is my friend. I like ___.", "o": ["he", "him", "his"], "a": 1}, {"q": "___ are happy. (мы)", "o": ["We", "Us", "Our"], "a": 0}], "tbl": {"t": "Таблица местоимений", "head": ["Кто?", "Кого? кому?", "Мой, твой"], "rows": [["I", "me", "my"], ["you", "you", "your"], ["he", "him", "his"], ["she", "her", "her"], ["it", "it", "its"], ["we", "us", "our"], ["they", "them", "their"]]}, "when": ["Подлежащее перед глаголом: <i>They live here.</i>", "Дополнение после глагола: <i>I see them every day.</i>", "После предлога: <i>Give it to him. Look at us.</i>", "You — это и «ты», и «вы»: подходит и для одного человека, и для нескольких."], "tip": "если местоимение стоит после глагола или предлога, берём me, him, her, us, them.", "mist": ["<span class=\"x\">✗ Me like tea.</span> <span class=\"v\">✓ I like tea.</span> В роли подлежащего нужна форма «кто?».", "<span class=\"x\">✗ Give it to he.</span> <span class=\"v\">✓ Give it to him.</span> После предлога ставим форму «кого? кому?».", "<span class=\"x\">✗ I see she.</span> <span class=\"v\">✓ I see her.</span> Дополнение — her, а не she."]}, {"t": "Вопросительные слова, to и from", "rule": ["Вопросительное слово ставится в начале и спрашивает о конкретной информации. После него — порядок вопроса: <b>слово + do / does + подлежащее + глагол</b>.", "Предлоги <b>to</b> и <b>from</b> показывают направление: куда и откуда."], "ex": [["Where do you live?", "Где ты живёшь?"], ["Why are you late?", "Почему ты опоздал?"], ["When is your birthday?", "Когда у тебя день рождения?"], ["I go to school. I come from Russia.", "Я хожу в школу. Я из России."], ["How do you go to work?", "Как ты добираешься до работы?"]], "q": [{"q": "___ is your birthday? In May.", "o": ["Where", "When", "Who"], "a": 1}, {"q": "___ do you go to school? By bus.", "o": ["How", "Why", "Who"], "a": 0}, {"q": "I come ___ Moscow.", "o": ["to", "from", "at"], "a": 1}, {"q": "___ is she? She is my sister.", "o": ["Who", "Where", "Why"], "a": 0}, {"q": "I get a letter ___ my mother every week. (от мамы)", "o": ["from", "to", "at"], "a": 0}], "tbl": {"t": "Вопросительные слова", "head": ["Слово", "Значение", "Пример"], "rows": [["What", "что, какой", "What is your name?"], ["Who", "кто", "Who is she?"], ["Where", "где, куда", "Where do you live?"], ["When", "когда", "When is your birthday?"], ["Why", "почему, зачем", "Why are you late?"], ["How", "как", "How are you?"]]}, "when": ["<b>to</b> — движение к месту или человеку: <i>I go to school. Give it to Anna.</i>", "<b>from</b> — источник или происхождение: <i>I come from Russia. A letter from my friend.</i>", "Вопрос «откуда ты?»: <i>Where are you from?</i>"], "tip": "порядок вопроса: вопросительное слово → do / does → кто → глагол. <i>Where do you live?</i>", "mist": ["<span class=\"x\">✗ Where you live?</span> <span class=\"v\">✓ Where do you live?</span> После вопросительного слова нужен do / does.", "<span class=\"x\">✗ Who you are?</span> <span class=\"v\">✓ Who are you?</span> С глаголом to be он выходит вперёд.", "<span class=\"x\">✗ I am from to Moscow.</span> <span class=\"v\">✓ I am from Moscow.</span> После from предлог to не нужен."]}, {"t": "Артикли a / an / the", "rule": ["В русском языке артиклей нет, а в английском они почти всегда стоят перед существительным. Артикль показывает, говорим ли мы о <b>любом</b> предмете или о <b>конкретном</b>.", "<b>a / an</b> — «один из», когда упоминаем предмет впервые: <i>I have a dog.</i> <b>the</b> — известный из контекста: <i>The dog is white.</i>"], "ex": [["I have an apple.", "У меня есть яблоко."], ["She is a teacher.", "Она учитель."], ["Close the door, please.", "Закрой дверь, пожалуйста."], ["I have a dog. The dog is white.", "У меня есть собака. Собака белая."], ["The sun is hot.", "Солнце жаркое."]], "q": [{"q": "I have ___ apple.", "o": ["a", "an", "the"], "a": 1}, {"q": "She is ___ teacher.", "o": ["a", "an", "the"], "a": 0}, {"q": "Close ___ door, please.", "o": ["a", "an", "the"], "a": 2}, {"q": "I have a cat. ___ cat is black.", "o": ["A", "An", "The"], "a": 2}, {"q": "He is ___ engineer.", "o": ["a", "an", "the"], "a": 1}], "tbl": {"t": "Как выбрать артикль", "head": ["Артикль", "Когда", "Пример"], "rows": [["a", "перед согласным звуком", "a book, a car"], ["an", "перед гласным звуком", "an apple, an hour"], ["the", "конкретный, уже известный предмет", "Close the door."]]}, "when": ["a / an — только с исчисляемыми в единственном числе.", "the — когда предмет один в своём роде (<i>the sun, the moon</i>) или собеседник знает, о чём речь.", "Без артикля — множественное число и неисчисляемые в общем смысле: <i>I like music. Dogs are friendly.</i>", "Важен звук, а не буква: <i>an hour</i> (h не читается), <i>a university</i> (читается «ю»)."], "tip": "в первый раз — a / an («какая-то собака»), во второй — the («та самая собака»).", "mist": ["<span class=\"x\">✗ I have apple.</span> <span class=\"v\">✓ I have an apple.</span> Перед исчисляемым существительным в единственном числе нужен артикль.", "<span class=\"x\">✗ a apple</span> <span class=\"v\">✓ an apple</span> Перед гласным звуком ставим an.", "<span class=\"x\">✗ She is teacher.</span> <span class=\"v\">✓ She is a teacher.</span> С профессией артикль тоже нужен."]}, {"t": "Множественное число существительных", "rule": ["Если предметов больше одного, к существительному добавляем окончание. Чаще всего это <b>-s</b>: <i>book → books</i>.", "Есть правила правописания и слова-исключения, которые нужно просто запомнить."], "ex": [["one box, two boxes", "одна коробка, две коробки"], ["one child, three children", "один ребёнок, трое детей"], ["A sheep is in the field. Two sheep are in the field.", "В поле одна овца. В поле две овцы."], ["These cities are big.", "Эти города большие."], ["She has two babies.", "У неё двое малышей."]], "q": [{"q": "Two ___ are in the garden. (child)", "o": ["childs", "children", "childrens"], "a": 1}, {"q": "I have two ___. (foot)", "o": ["foots", "feets", "feet"], "a": 2}, {"q": "There are three ___ on the table. (box)", "o": ["boxs", "boxes", "boxen"], "a": 1}, {"q": "I have two ___. (baby)", "o": ["babys", "babies", "babyes"], "a": 1}, {"q": "There are three ___ in the field. (sheep)", "o": ["sheeps", "sheep", "sheepes"], "a": 1}], "tbl": {"t": "Правила образования", "head": ["Правило", "Один", "Много"], "rows": [["обычно + -s", "book", "books"], ["-s, -ch, -sh, -x + -es", "box, watch", "boxes, watches"], ["согласная + y → -ies", "city, baby", "cities, babies"], ["-f / -fe → -ves", "knife, leaf", "knives, leaves"], ["особые формы", "man, woman, child", "men, women, children"], ["особые формы", "foot, tooth, mouse", "feet, teeth, mice"], ["не меняются", "sheep, fish, deer", "sheep, fish, deer"]]}, "when": ["Говорим о нескольких предметах: <i>two books, three boxes.</i>", "This / that меняются на these / those: <i>this book → these books.</i>", "Глагол согласуется с числом: <i>The children are here.</i>", "Окончание читается по-разному: books [s], dogs [z], boxes [iz]."], "tip": "слова man, woman, child, foot, tooth лучше учить парами: man — men, child — children.", "mist": ["<span class=\"x\">✗ two childs</span> <span class=\"v\">✓ two children</span> Слово child образует множественное число особым способом.", "<span class=\"x\">✗ two man</span> <span class=\"v\">✓ two men</span> Man → men.", "<span class=\"x\">✗ two sheeps</span> <span class=\"v\">✓ two sheep</span> У sheep форма не меняется."]}, {"t": "Исчисляемые и неисчисляемые существительные", "rule": ["<b>Исчисляемые</b> существительные можно посчитать: <i>one apple, two apples</i>. <b>Неисчисляемые</b> посчитать нельзя: <i>water, milk, rice, money, advice, news</i>.", "У неисчисляемых нет множественного числа, глагол стоит в единственном числе, а a / an перед ними не ставят."], "ex": [["I need some water.", "Мне нужна вода."], ["She gave me a piece of advice.", "Она дала мне совет."], ["Milk comes from cows.", "Молоко получают от коров."], ["The news is good.", "Новости хорошие."], ["Can I have a glass of water?", "Можно мне стакан воды?"]], "q": [{"q": "I need ___ advice.", "o": ["an", "some", "two"], "a": 1}, {"q": "Milk ___ from cows.", "o": ["come", "comes", "are"], "a": 1}, {"q": "Can I have a ___ of water?", "o": ["glass", "piece", "slice"], "a": 0}, {"q": "Our furniture ___ new.", "o": ["is", "are", "were"], "a": 0}, {"q": "He gave me a good piece of ___.", "o": ["advice", "advices", "an advice"], "a": 0}], "tbl": {"t": "Сравнение", "head": ["Тип", "Что с ним делаем", "Пример"], "rows": [["исчисляемые", "a / an, two, many", "an apple, two apples"], ["неисчисляемые", "some, much, a lot of", "some water, much money"], ["неисчисляемые", "считаем через слова-«контейнеры»", "a glass of water, a piece of advice"]]}, "when": ["Еда и жидкости: <i>water, milk, bread, rice, cheese.</i>", "Абстрактные слова: <i>advice, information, news, music, love.</i>", "Вещества и материалы: <i>wood, glass, gold.</i>", "Некоторые слова неисчисляемые в английском, но исчисляемые в русском: <i>advice, news, furniture, money.</i>"], "extra": {"t": "Слова-«контейнеры»", "p": ["<b>a glass of</b> water, <b>a bottle of</b> milk, <b>a cup of</b> tea, <b>a slice of</b> bread, <b>a piece of</b> advice / news / furniture, <b>a bar of</b> chocolate, <b>a packet of</b> rice."]}, "tip": "если можно сказать «один, два, три …», слово исчисляемое. Если нельзя, берём some или контейнер вроде a piece of.", "mist": ["<span class=\"x\">✗ an advice</span> <span class=\"v\">✓ a piece of advice</span> Advice нельзя посчитать, берём контейнер.", "<span class=\"x\">✗ The news are bad.</span> <span class=\"v\">✓ The news is bad.</span> News — единственное число.", "<span class=\"x\">✗ furnitures</span> <span class=\"v\">✓ furniture</span> У этого слова нет множественного числа."]}, {"t": "A / an, one и some", "rule": ["<b>a / an</b> — один, любой, без уточнения: <i>He bought a tie.</i> <b>one</b> — когда важно именно число: <i>He bought one tie, not two.</i>", "<b>some</b> — немного, несколько. Ставим с множественным числом и с неисчисляемыми: <i>some flowers, some milk</i>."], "ex": [["I go to the gym twice a week.", "Я хожу в спортзал два раза в неделю."], ["We need some milk and some flour.", "Нам нужны молоко и мука."], ["This is an expensive ring.", "Это дорогое кольцо."], ["He bought one tie, not two.", "Он купил один галстук, а не два."], ["The car goes 80 km an hour.", "Машина едет со скоростью 80 км в час."]], "q": [{"q": "I go to the gym twice ___ week.", "o": ["a", "an", "the"], "a": 0}, {"q": "We need ___ flour.", "o": ["a", "an", "some"], "a": 2}, {"q": "This ring is ___.", "o": ["expensive", "an expensive", "a expensive"], "a": 0}, {"q": "I bought ___ apples.", "o": ["a", "some", "an"], "a": 1}, {"q": "The tea costs two euros ___ cup.", "o": ["a", "the", "some"], "a": 0}], "tbl": {"t": "Сравнение", "head": ["Слово", "С чем", "Пример"], "rows": [["a / an", "один предмет", "a tie, an egg"], ["one", "число важно", "one tie, not two"], ["some", "много или неисчисляемое", "some flowers, some milk"]]}, "when": ["a / an в значении «в»: <i>twice a week, 80 km an hour.</i>", "one в дате и времени: <i>one day, one morning.</i>", "some в утверждениях, any в вопросах и отрицаниях (подробнее в уроке A2).", "Перед прилагательным без существительного артикль не нужен: <i>This ring is expensive.</i> Но: <i>This is an expensive ring.</i>"], "tip": "a / an — один предмет, some — несколько или немного, one — когда важно подчеркнуть число.", "mist": ["<span class=\"x\">✗ I need a milk.</span> <span class=\"v\">✓ I need some milk.</span> С неисчисляемыми a / an не ставим.", "<span class=\"x\">✗ This ring is an expensive.</span> <span class=\"v\">✓ This ring is expensive.</span> Без существительного артикль не нужен.", "<span class=\"x\">✗ I have some book.</span> <span class=\"v\">✓ I have a book. / I have some books.</span> Some не ставим перед единственным числом."]}]},
{"id": "A2", "name": "Элементарный", "d": "Рассказ о прошлом и сравнение предметов.", "lessons": [{"t": "Past Simple", "rule": ["Past Simple — прошедшее простое: действие закончилось в прошлом, часто указано когда (<i>yesterday, last year, in 2020, two days ago</i>).", "Правильные глаголы: <b>+ -ed</b> (<i>work → worked</i>). Неправильные нужно учить: <i>go → went, see → saw</i>. Вопрос и отрицание — через <b>did / did not</b>, глагол при этом в начальной форме."], "ex": [["I watched a film yesterday.", "Вчера я смотрел фильм."], ["She went to Paris last year.", "В прошлом году она ездила в Париж."], ["Did you call him? — No, I did not.", "Ты звонил ему? — Нет."], ["We did not see the match.", "Мы не видели матч."], ["When did he arrive?", "Когда он приехал?"]], "q": [{"q": "Yesterday I ___ to the cinema.", "o": ["go", "went", "gone"], "a": 1}, {"q": "She didn't ___ the news.", "o": ["watched", "watch", "watches"], "a": 1}, {"q": "___ you call him?", "o": ["Do", "Did", "Were"], "a": 1}, {"q": "We ___ pizza yesterday.", "o": ["eat", "ate", "eaten"], "a": 1}, {"q": "___ you see Tom last night?", "o": ["Do", "Did", "Were"], "a": 1}], "tbl": {"t": "Три формы", "head": ["Форма", "Схема", "Пример"], "rows": [["+", "глагол-ed / 2-я форма", "I worked. She went."], ["−", "did not + глагол", "I did not work."], ["?", "Did + подлежащее + глагол?", "Did you work?"]]}, "when": ["Законченное действие в прошлом: <i>I visited Rome in 2019.</i>", "Цепочка событий: <i>He got up, had breakfast and left.</i>", "Время указано или понятно из контекста: <i>yesterday, last week, ago.</i>"], "extra": {"t": "Правописание -ed и частые неправильные", "p": ["<b>-e</b> + d: <i>like → liked</i>. <b>согласная + y</b> → ied: <i>study → studied</i>. Одна гласная + согласная — удваиваем: <i>stop → stopped</i>.", "go — went, see — saw, have — had, do — did, take — took, buy — bought, come — came, make — made, eat — ate, write — wrote."]}, "tip": "в вопросе и отрицании «прошлое» несёт did, поэтому сам глагол возвращается к начальной форме.", "mist": ["<span class=\"x\">✗ Did you saw it?</span> <span class=\"v\">✓ Did you see it?</span> После did глагол в начальной форме.", "<span class=\"x\">✗ I goed home.</span> <span class=\"v\">✓ I went home.</span> Go — неправильный глагол.", "<span class=\"x\">✗ She not liked it.</span> <span class=\"v\">✓ She did not like it.</span> Отрицание строим через did not."]}, {"t": "Степени сравнения", "rule": ["Сравнительная степень отвечает на вопрос «какой по сравнению с другим?». Короткие прилагательные: <b>+ -er than</b> (<i>taller than</i>). Длинные: <b>more + прилагательное + than</b> (<i>more interesting than</i>)."], "ex": [["My sister is taller than me.", "Моя сестра выше меня."], ["This book is more interesting than that one.", "Эта книга интереснее той."], ["Today is better than yesterday.", "Сегодня лучше, чем вчера."], ["He is not as old as he looks.", "Он не такой старый, как выглядит."], ["It is getting warmer.", "Становится теплее."]], "q": [{"q": "This bag is ___ than that one.", "o": ["cheap", "cheaper", "more cheap"], "a": 1}, {"q": "Flying is ___ than going by train.", "o": ["more expensive", "expensiver", "most expensive"], "a": 0}, {"q": "Your English is ___ than mine.", "o": ["good", "gooder", "better"], "a": 2}, {"q": "Moscow is ___ than Kazan.", "o": ["bigger", "more big", "biggest"], "a": 0}, {"q": "This exercise is ___ difficult than the last one.", "o": ["more", "most", "much"], "a": 0}], "tbl": {"t": "Образование", "head": ["Тип", "Правило", "Пример"], "rows": [["короткие", "+ -er", "old → older"], ["на -e", "+ -r", "nice → nicer"], ["на -y", "y → -ier", "happy → happier"], ["одна гласная + согласная", "удвоение", "big → bigger"], ["длинные (2+ слога)", "more …", "more beautiful"], ["исключения", "особые формы", "good → better, bad → worse, far → farther"]]}, "when": ["Сравниваем два предмета: <i>My bag is bigger than yours.</i>", "Постепенное изменение: <i>It is getting colder and colder.</i>", "Одинаковость: <i>as … as</i>: <i>He is as tall as me.</i>"], "tip": "один-два слога — -er, три и больше — more. Исключения good — better и bad — worse учим наизусть.", "mist": ["<span class=\"x\">✗ more taller</span> <span class=\"v\">✓ taller</span> Двойное сравнение не нужно.", "<span class=\"x\">✗ He is taller that me.</span> <span class=\"v\">✓ He is taller than me.</span> Сравниваем с помощью than.", "<span class=\"x\">✗ gooder</span> <span class=\"v\">✓ better</span> Good — особая форма."]}, {"t": "Will, do / does, did", "rule": ["Эти слова — вспомогательные: сами не переводятся, но строят вопросы и отрицания. <b>do / does</b> — настоящее, <b>did</b> — прошедшее, <b>will</b> — будущее. После них смысловой глагол стоит в начальной форме без to."], "ex": [["Do you speak English?", "Ты говоришь по-английски?"], ["She does not live here.", "Она здесь не живёт."], ["Did they come yesterday?", "Они приходили вчера?"], ["I will call you tomorrow.", "Я позвоню тебе завтра."], ["He won't be late.", "Он не опоздает."]], "q": [{"q": "We ___ call you tomorrow.", "o": ["will", "did", "does"], "a": 0}, {"q": "She ___ like horror films: she never watches them.", "o": ["do not", "does not", "will not"], "a": 1}, {"q": "Did you ___ the film yesterday?", "o": ["loved", "love", "loves"], "a": 1}, {"q": "___ he play football on Sundays?", "o": ["Do", "Does", "Will"], "a": 1}, {"q": "I ___ forget your birthday! (обещание)", "o": ["do not", "did not", "will not"], "a": 2}], "tbl": {"t": "Какой помощник", "head": ["Время", "Вопрос", "Отрицание"], "rows": [["Present Simple", "Do / Does you work?", "do not / does not work"], ["Past Simple", "Did you work?", "did not work"], ["Future Simple", "Will you work?", "will not (won't) work"]]}, "when": ["does — только с he / she / it: <i>Does she know?</i>", "will — обещания, решения в момент речи, прогнозы: <i>I will help you.</i>", "Сокращения: <i>don't, doesn't, didn't, won't.</i>", "С глаголом to be вспомогательные не нужны: <i>Is she here?</i>"], "tip": "один вопрос — один помощник. Он уже показал время и лицо, поэтому смысловой глагол не меняется.", "mist": ["<span class=\"x\">✗ Does she likes tea?</span> <span class=\"v\">✓ Does she like tea?</span> После does глагол без -s.", "<span class=\"x\">✗ I will to go.</span> <span class=\"v\">✓ I will go.</span> После will нет to.", "<span class=\"x\">✗ She don't know.</span> <span class=\"v\">✓ She doesn't know.</span> С she нужен does."]}, {"t": "Полезные слова и разговорные вставки", "rule": ["В живой речи мы используем «мостики» между мыслями. Они делают разговор естественным и показывают отношение к сказанному."], "ex": [["Well, I am not sure.", "Ну, я не уверен."], ["Actually, I live in Kazan.", "Вообще-то, я живу в Казани."], ["By the way, did you see Anna?", "Кстати, ты видел Анну?"], ["Anyway, we should go.", "В общем, нам пора."], ["Of course you can come!", "Конечно, ты можешь прийти!"]], "q": [{"q": "Как по-английски «сценарий»?", "o": ["script", "novel", "order"], "a": 0}, {"q": "Thank you! — You are ___.", "o": ["welcome", "sorry", "please"], "a": 0}, {"q": "Фраза «я имею в виду»:", "o": ["I regret", "I mean", "I order"], "a": 1}, {"q": "___, I live in Kazan, not Moscow. (вообще-то)", "o": ["Actually", "Actual", "Really"], "a": 0}, {"q": "___, where is Tom? (кстати)", "o": ["By the way", "At the way", "On way"], "a": 0}], "tbl": {"t": "Частые вставки", "head": ["Слово", "Значение", "Пример"], "rows": [["well", "ну, что ж", "Well, let me think."], ["actually", "вообще-то, на самом деле", "Actually, I disagree."], ["by the way", "кстати", "By the way, where is Tom?"], ["anyway", "в любом случае", "Anyway, let's go."], ["of course", "конечно", "Of course I can!"], ["I mean", "то есть, я имею в виду", "I mean, it is too far."], ["you know", "знаешь", "It is, you know, difficult."], ["so", "итак, так что", "So, what next?"]]}, "when": ["Начало ответа: <i>Well, … / Actually, …</i>", "Смена темы: <i>By the way, … / Anyway, …</i>", "Уточнение мысли: <i>I mean, … / You know, …</i>", "В письме и на экзаменах такие слова лучше использовать реже."], "tip": "вставки не меняют смысл фразы, зато звучат естественно. Одной-двух на реплику достаточно.", "mist": ["<span class=\"x\">✗ Actually, it is actual.</span> <span class=\"v\">✓ Actually, it is true.</span> Actually значит «на самом деле», а не «актуально».", "<span class=\"x\">✗ Anyway, I think is late.</span> <span class=\"v\">✓ Anyway, I think it is late.</span> В английском предложении подлежащее обязательно.", "<span class=\"x\">✗ By the way I forgot it.</span> <span class=\"v\">✓ By the way, I forgot it.</span> После вставки ставим запятую."]}, {"t": "Much / many, some / any", "rule": ["<b>many</b> — с исчисляемыми (<i>many books</i>), <b>much</b> — с неисчисляемыми (<i>much water</i>). Они чаще в вопросах и отрицаниях. <b>some</b> — в утверждениях, <b>any</b> — в вопросах и отрицаниях."], "ex": [["I don't have much time.", "У меня мало времени."], ["Are there many people?", "Там много людей?"], ["I need some help.", "Мне нужна помощь."], ["Is there any milk?", "Молоко есть?"], ["Would you like some coffee?", "Хочешь кофе?"]], "q": [{"q": "How ___ apples do you want?", "o": ["much", "many", "any"], "a": 1}, {"q": "We do not have ___ milk.", "o": ["some", "any", "many"], "a": 1}, {"q": "There is ___ water in the glass.", "o": ["some", "any", "many"], "a": 0}, {"q": "How ___ money do you have?", "o": ["many", "much", "any"], "a": 1}, {"q": "There aren't ___ chairs here.", "o": ["some", "any", "much"], "a": 1}], "tbl": {"t": "Что с чем", "head": ["", "Утверждение", "Вопрос / отрицание"], "rows": [["исчисляемые", "some books", "any books, many books"], ["неисчисляемые", "some water", "any water, much water"]]}, "when": ["Предложение/просьба: <i>Would you like some tea?</i> (some).", "Утверждение: <i>I have some friends.</i>", "Вопрос: <i>Do you have any friends?</i>", "Отрицание: <i>I don't have any money.</i>"], "tip": "сначала выбираем между many и much (можно ли посчитать?), потом между some и any (утверждение или вопрос?).", "mist": ["<span class=\"x\">✗ I have any friends.</span> <span class=\"v\">✓ I have some friends.</span> В утверждении ставим some.", "<span class=\"x\">✗ How much books?</span> <span class=\"v\">✓ How many books?</span> Books — исчисляемое.", "<span class=\"x\">✗ I don't have some money.</span> <span class=\"v\">✓ I don't have any money.</span> В отрицании нужен any."]}, {"t": "Превосходная степень", "rule": ["Превосходная степень — «самый»: <b>the + прилагательное-est</b> (<i>the tallest</i>) или <b>the most + длинное прилагательное</b> (<i>the most expensive</i>). Артикль the обязателен."], "ex": [["This is the tallest building in the city.", "Это самое высокое здание в городе."], ["She is the best student of all.", "Она лучшая из всех студентов."], ["It was the most expensive hotel.", "Это был самый дорогой отель."], ["Today is the worst day of my life.", "Сегодня худший день в моей жизни."], ["He is the youngest in our team.", "Он самый молодой в нашей команде."]], "q": [{"q": "Peter is the ___ student of all.", "o": ["smartest", "smarter", "most smart"], "a": 0}, {"q": "It is the most expensive restaurant ___ our town.", "o": ["of", "in", "than"], "a": 1}, {"q": "He seems ___ better today.", "o": ["much", "most", "very"], "a": 0}, {"q": "This is ___ film I have ever seen.", "o": ["the most boring", "the boringest", "more boring"], "a": 0}, {"q": "Mount Everest is ___ mountain in the world.", "o": ["higher", "the highest", "the most high"], "a": 1}], "tbl": {"t": "Сравнительная и превосходная", "head": ["Исходное", "Сравнительная", "Превосходная"], "rows": [["tall", "taller", "the tallest"], ["nice", "nicer", "the nicest"], ["big", "bigger", "the biggest"], ["easy", "easier", "the easiest"], ["beautiful", "more beautiful", "the most beautiful"], ["good", "better", "the best"], ["bad", "worse", "the worst"]]}, "when": ["Выбор из группы: <i>She is the best student in the class.</i>", "Часто с in / of: <i>the tallest in the world; the best of all.</i>", "Часто с Present Perfect: <i>the best film I have ever seen.</i>"], "tip": "вспоминаем сравнительную: если там -er, то здесь the -est; если more, то the most.", "mist": ["<span class=\"x\">✗ the most tallest</span> <span class=\"v\">✓ the tallest</span> Две формы сразу не нужны.", "<span class=\"x\">✗ She is best student.</span> <span class=\"v\">✓ She is the best student.</span> Нужен the.", "<span class=\"x\">✗ the most good</span> <span class=\"v\">✓ the best</span> Good — исключение."]}, {"t": "Present Simple и Present Continuous", "rule": ["<b>Present Simple</b> — привычки, факты, расписания (<i>I work every day</i>). <b>Present Continuous</b> (<i>am / is / are + глагол-ing</i>) — действие происходит сейчас или в этот период (<i>I am working now</i>)."], "ex": [["I drink tea every morning.", "Я пью чай каждое утро."], ["I am drinking tea now.", "Я пью чай сейчас."], ["She lives in Moscow, but now she is staying in Rome.", "Она живёт в Москве, но сейчас остановилась в Риме."], ["Water boils at 100 degrees.", "Вода кипит при 100 градусах."], ["Listen! Someone is singing.", "Слушай! Кто-то поёт."]], "q": [{"q": "She ___ in a bank. (постоянная работа)", "o": ["works", "is working", "work"], "a": 0}, {"q": "Be quiet! The baby ___ now.", "o": ["sleeps", "is sleeping", "sleep"], "a": 1}, {"q": "The plane ___ at 8:30. (расписание)", "o": ["arrives", "is arriving", "arrive"], "a": 0}, {"q": "Look! It ___.", "o": ["rains", "is raining", "rain"], "a": 1}, {"q": "She ___ coffee every morning.", "o": ["drinks", "is drinking", "drink"], "a": 0}], "tbl": {"t": "Сравнение", "head": ["", "Present Simple", "Present Continuous"], "rows": [["смысл", "регулярно, всегда", "сейчас, временно"], ["слова", "always, usually, every day", "now, today, at the moment"], ["форма", "work / works", "am / is / are working"], ["пример", "I walk to work.", "I am walking now."]]}, "when": ["Simple: расписание, факты, привычки.", "Continuous: сейчас и вокруг этого момента.", "Always с Continuous — раздражение: <i>He is always losing his keys!</i>"], "extra": {"t": "Глаголы, которые не любят -ing", "p": ["Глаголы состояния обычно не используются в Continuous: <i>know, like, love, want, need, understand, believe, have (иметь).</i> Говорим <i>I know</i>, а не <i>I am knowing</i>."]}, "tip": "ищем слова-подсказки: every day, usually → Simple; now, at the moment → Continuous.", "mist": ["<span class=\"x\">✗ I am knowing him.</span> <span class=\"v\">✓ I know him.</span> Know не употребляется в Continuous.", "<span class=\"x\">✗ He works now.</span> <span class=\"v\">✓ He is working now.</span> Now — признак Continuous.", "<span class=\"x\">✗ I am going to school every day.</span> <span class=\"v\">✓ I go to school every day.</span> Every day — привычка, нужен Simple."]}, {"t": "Наречия: как и насколько", "rule": ["Наречия отвечают на вопрос «как?» и «насколько?». Наречия образа действия чаще всего образуем так: <b>прилагательное + -ly</b> (<i>slow → slowly</i>)."], "ex": [["He drives carefully.", "Он водит осторожно."], ["She sings beautifully.", "Она красиво поёт."], ["He speaks English well.", "Он хорошо говорит по-английски."], ["It is very cold today.", "Сегодня очень холодно."], ["I hardly know him.", "Я его едва знаю."]], "q": [{"q": "She speaks English very ___.", "o": ["good", "well", "goodly"], "a": 1}, {"q": "He works ___ than me.", "o": ["harder", "more hard", "hardlier"], "a": 0}, {"q": "He drives ___ carefully than me.", "o": ["more", "most", "-er"], "a": 0}, {"q": "He works very ___.", "o": ["hard", "hardly", "harder"], "a": 0}, {"q": "She is a ___ driver. She drives ___.", "o": ["careful / carefully", "carefully / careful", "careful / careful"], "a": 0}], "tbl": {"t": "Образование", "head": ["Правило", "Прилагательное", "Наречие"], "rows": [["+ ly", "quick", "quickly"], ["-y → -ily", "happy", "happily"], ["-le → -ly", "simple", "simply"], ["исключения", "good", "well"], ["без изменений", "fast, hard, late", "fast, hard, late"]]}, "when": ["После глагола: <i>She speaks slowly.</i>", "Перед прилагательным усиливают его: <i>very cold.</i>", "Hard — трудно, hardly — едва; late — поздно, lately — недавно."], "extra": {"t": "Наречия степени", "p": ["<b>very</b> — очень, <b>quite</b> — довольно, <b>really</b> — действительно, <b>too</b> — слишком, <b>a bit</b> — немного, <b>enough</b> — достаточно."]}, "tip": "прилагательное описывает предмет (a good singer), наречие — действие (sings well).", "mist": ["<span class=\"x\">✗ She speaks good.</span> <span class=\"v\">✓ She speaks well.</span> Для глагола нужно наречие well.", "<span class=\"x\">✗ He runs quick.</span> <span class=\"v\">✓ He runs quickly.</span> Добавляем -ly.", "<span class=\"x\">✗ I am very agree.</span> <span class=\"v\">✓ I agree completely.</span> Agree — глагол, к нему подходит completely."]}, {"t": "Many, much, few, little, a lot of", "rule": ["Слова количества нужно выбирать по двум вопросам: можно ли посчитать предмет и хотим ли подчеркнуть, что его <b>мало</b> или <b>достаточно</b>."], "ex": [["I have a few friends in London.", "У меня несколько друзей в Лондоне."], ["There is little time left.", "Времени почти не осталось."], ["She has a lot of books.", "У неё много книг."], ["We don't have much money.", "У нас мало денег."], ["Few people know this.", "Мало кто это знает."]], "q": [{"q": "There is only ___ milk left. (немного)", "o": ["a little", "a few", "many"], "a": 0}, {"q": "She has several ___.", "o": ["friend", "friends", "money"], "a": 1}, {"q": "We have ___ of time.", "o": ["plenty", "many", "few"], "a": 0}, {"q": "There is ___ sugar left. We need to buy more.", "o": ["little", "a little", "few"], "a": 0}, {"q": "We have ___ time before the train.", "o": ["a few", "a little", "many"], "a": 1}], "tbl": {"t": "Количество", "head": ["Смысл", "Исчисляемые", "Неисчисляемые"], "rows": [["много", "many", "much"], ["много (в утв.)", "a lot of", "a lot of"], ["немного, есть", "a few", "a little"], ["почти нет", "few", "little"]]}, "when": ["a few / a little — нейтрально или положительно: <i>I have a few friends here.</i>", "few / little — почти нет, нехватка: <i>I have few friends.</i>", "a lot of — подходит везде в утверждениях."], "tip": "a few / a little — «немного, но есть»; few / little (без a) — «почти нет».", "mist": ["<span class=\"x\">✗ I have a little friends.</span> <span class=\"v\">✓ I have a few friends.</span> Friends можно посчитать.", "<span class=\"x\">✗ There is a few milk.</span> <span class=\"v\">✓ There is a little milk.</span> Milk неисчисляемое.", "<span class=\"x\">✗ I have much books.</span> <span class=\"v\">✓ I have a lot of books.</span> В утверждении лучше a lot of."]}, {"t": "News, physics, trousers: число существительных", "rule": ["Часть существительных ведёт себя необычно. Одни слова похожи на множественное число (-s), но по смыслу единственные. Другие всегда во множественном числе, потому что состоят из двух частей."], "ex": [["The news is interesting.", "Новости интересные."], ["Physics is my favourite subject.", "Физика — мой любимый предмет."], ["My trousers are new.", "Мои брюки новые."], ["I bought a pair of jeans.", "Я купил джинсы."], ["The police are here.", "Полиция здесь."]], "q": [{"q": "Mathematics ___ my favourite subject.", "o": ["is", "are", "were"], "a": 0}, {"q": "Where ___ my trousers?", "o": ["is", "are", "am"], "a": 1}, {"q": "I bought a ___ of scissors.", "o": ["pair", "piece", "couple"], "a": 0}, {"q": "Mathematics ___ difficult for me.", "o": ["is", "are", "were"], "a": 0}, {"q": "Where ___ my glasses?", "o": ["is", "are", "be"], "a": 1}], "tbl": {"t": "Особые существительные", "head": ["Группа", "Примеры", "Глагол"], "rows": [["науки", "physics, maths, economics", "is"], ["новости и игры", "news, billiards", "is"], ["парные предметы", "trousers, jeans, scissors, glasses", "are"], ["группы людей", "police, people, cattle", "are"]]}, "when": ["Информация и науки — единственное число.", "Одежда из {"id": "B1", "name": "Средний", "d": "Связь прошлого с настоящим и условия.", "lessons": [{"t": "Present Perfect и Past Simple", "rule": ["<b>Present Perfect</b> (<i>have / has + 3-я форма</i>) связывает прошлое с настоящим: важен результат или опыт, а не время. <b>Past Simple</b> — законченное действие в конкретный момент прошлого."], "ex": [["I have seen this film.", "Я видел этот фильм."], ["I saw it last week.", "Я видел его на прошлой неделе."], ["She has lived here since 2015.", "Она живёт здесь с 2015 года."], ["Have you ever eaten sushi?", "Ты когда-нибудь ел суши?"], ["He has just left.", "Он только что ушёл."]], "q": [{"q": "I ___ three emails today.", "o": ["wrote", "have written", "was writing"], "a": 1}, {"q": "She ___ in London in 2019.", "o": ["lived", "has lived", "have lived"], "a": 0}, {"q": "We ___ here since Monday.", "o": ["were", "have been", "are"], "a": 1}, {"q": "I ___ my keys. I can't open the door.", "o": ["lost", "have lost", "was losing"], "a": 1}, {"q": "We ___ to Rome in 2019.", "o": ["have been", "went", "have gone"], "a": 1}], "tbl": {"t": "Сравнение", "head": ["", "Present Perfect", "Past Simple"], "rows": [["время", "не указано", "указано (yesterday, in 2010)"], ["акцент", "результат, опыт", "факт в прошлом"], ["слова", "ever, never, already, yet, just, since, for", "ago, last year, yesterday, when"], ["пример", "I have lost my keys.", "I lost my keys yesterday."]]}, "when": ["Опыт: <i>Have you ever been to Italy?</i>", "Результат виден сейчас: <i>I have cleaned the room.</i>", "Продолжается до сейчас: <i>I have lived here for 5 years.</i>", "Если есть точное время в прошлом — только Past Simple."], "tip": "есть точное время в прошлом — Past Simple; важны опыт и результат до сегодняшнего дня — Present Perfect.", "mist": ["<span class=\"x\">✗ I have seen him yesterday.</span> <span class=\"v\">✓ I saw him yesterday.</span> Yesterday требует Past Simple.", "<span class=\"x\">✗ Did you ever see Paris?</span> <span class=\"v\">✓ Have you ever seen Paris?</span> Опыт — Present Perfect.", "<span class=\"x\">✗ I live here since 2015.</span> <span class=\"v\">✓ I have lived here since 2015.</span> Since требует Perfect."]}, {"t": "Условные 0 и 1 типа", "rule": ["<b>Условное 0</b> — общие истины: <i>If you heat ice, it melts.</i> <b>Условное 1</b> — реальное условие в будущем: <i>If it rains, I will stay at home.</i>", "В придаточной части после if будущее время не используется — только настоящее."], "ex": [["If you heat water, it boils.", "Если нагреть воду, она закипает."], ["If it rains, we will stay at home.", "Если пойдёт дождь, мы останемся дома."], ["I will call you if I have time.", "Я позвоню, если будет время."], ["Unless you hurry, you will miss the bus.", "Если не поторопишься, пропустишь автобус."], ["If she comes, I will tell her.", "Если она придёт, я ей скажу."]], "q": [{"q": "If it ___ tomorrow, we'll stay home.", "o": ["rains", "will rain", "rained"], "a": 0}, {"q": "I'll call you when I ___.", "o": ["will arrive", "arrive", "arrived"], "a": 1}, {"q": "If you ___ ice, it melts.", "o": ["heat", "will heat", "heated"], "a": 0}, {"q": "If you ___ me, I will help you.", "o": ["ask", "will ask", "asked"], "a": 0}, {"q": "If you mix red and blue, you ___ purple.", "o": ["get", "will got", "getting"], "a": 0}], "tbl": {"t": "Формулы", "head": ["Тип", "if-часть", "Главная часть"], "rows": [["0", "Present Simple", "Present Simple"], ["1", "Present Simple", "will + глагол"]]}, "when": ["Закон природы, привычка → тип 0.", "Реальный план, угроза, обещание → тип 1.", "Можно поменять части местами: <i>I will stay at home if it rains.</i> Запятая нужна только когда if в начале.", "Вместо if часто unless (если не): <i>Unless you hurry, you will be late.</i>"], "tip": "если не знаешь, где ставить will, ищи if — его часть всегда в настоящем.", "mist": ["<span class=\"x\">✗ If it will rain, I stay.</span> <span class=\"v\">✓ If it rains, I will stay.</span> После if нет will.", "<span class=\"x\">✗ If =\"x\">✗ I was knowing him.</span> <span class=\"v\">✓ I knew him.</span> Know не употребляется в Continuous.", "<span class=\"x\">✗ When I walked, it rained.</span> <span class=\"v\">✓ While I was walking, it started to rain.</span> Нужен процесс.", "<span class=\"x\">✗ She watched TV when I came.</span> <span class=\"v\">✓ She was watching TV when I came.</span> Длинный фон — Continuous."]}, {"t": "Инфинитив и -ing", "rule": ["После некоторых глаголов следует инфинитив (<i>to do</i>), после других — форма на -ing (<i>doing</i>). Это нужно запомнить как пару «глагол + форма»."], "ex": [["I want to learn English.", "Я хочу выучить английский."], ["She enjoys cooking.", "Ей нравится готовить."], ["He decided to leave.", "Он решил уехать."], ["I am interested in learning languages.", "Мне интересно изучать языки."], ["They finished working at six.", "Они закончили работу в шесть."]], "q": [{"q": "She enjoys ___ to music.", "o": ["listen", "listening", "to listen"], "a": 1}, {"q": "We decided ___ a taxi.", "o": ["take", "taking", "to take"], "a": 2}, {"q": "I went to the shop ___ some bread.", "o": ["buy", "to buy", "buying"], "a": 1}, {"q": "She hopes ___ a doctor.", "o": ["to be", "being", "be"], "a": 0}, {"q": "I am tired of ___ for the bus.", "o": ["wait", "waiting", "to wait"], "a": 1}], "tbl": {"t": "Что после чего", "head": ["+ to + глагол", "+ глагол-ing", "любое"], "rows": [["want, decide, hope, plan", "enjoy, finish, mind", "like, love, hate"], ["need, learn, agree", "keep, avoid, suggest", "start, begin"], ["I want to go.", "I enjoy swimming.", "I like to swim / swimming."]]}, "when": ["Цель: <i>I came here to study.</i>", "После предлога — только -ing: <i>I am good at drawing.</i>", "Подлежащее: <i>Swimming is fun.</i>"], "tip": "после предлога всегда -ing. А со многими глаголами выбор нужно просто запомнить.", "mist": ["<span class=\"x\">✗ I enjoy to swim.</span> <span class=\"v\">✓ I enjoy swimming.</span> После enjoy идёт -ing.", "<span class=\"x\">✗ I want going.</span> <span class=\"v\">✓ I want to go.</span> После want — to + глагол.", "<span class=\"x\">✗ I am good at to draw.</span> <span class=\"v\">✓ I am good at drawing.</span> После предлога — -ing."]}, {"t": "Used to и would о прошлом", "rule": ["<b>used to + глагол</b> — привычка или состояние в прошлом, которых уже нет. <b>would</b> — только для повторяющихся действий, не для состояний."], "ex": [["I used to live in Kazan.", "Раньше я жил в Казани."], ["We would play football every day.", "Мы, бывало, каждый день играли в футбол."], ["She didn't use to like coffee.", "Раньше она не любила кофе."], ["Did you use to have a dog?", "У тебя раньше была собака?"], ["There used to be a cinema here.", "Раньше здесь был кинотеатр."]], "q": [{"q": "I ___ smoke, but I stopped last year.", "o": ["used to", "am used to", "use to"], "a": 0}, {"q": "Did you ___ live in London?", "o": ["used to", "use to", "using to"], "a": 1}, {"q": "He ___ be shy, but now he is confident.", "o": ["would", "used to", "is used to"], "a": 1}, {"q": "I ___ have long hair, but now it is short.", "o": ["used to", "use to", "am used to"], "a": 0}, {"q": "Which is NOT possible?", "o": ["We would visit grandma every Sunday.", "I would live in Rome.", "We used to visit grandma."], "a": 1}], "tbl": {"t": "Формы used to", "head": ["Форма", "Пример"], "rows": [["+", "I used to smoke."], ["−", "I didn't use to smoke."], ["?", "Did you use to smoke?"]]}, "when": ["Состояния только с used to: <i>I used to live here.</i> (не would).", "Повторяющиеся действия — оба варианта: <i>We would play outside every day.</i>", "Говорим о том, что изменилось."], "tip": "для состояний (be, have, like, live) только used to; would подходит лишь для повторяющихся действий.", "mist": ["<span class=\"x\">✗ I used to living here.</span> <span class=\"v\">✓ I used to live here.</span> После used to — глагол в начальной форме.", "<span class=\"x\">✗ Did you used to?</span> <span class=\"v\">✓ Did you use to?</span> В вопросе и отрицании -d пропадает.", "<span class=\"x\">✗ I would be shy.</span> <span class=\"v\">✓ I used to be shy.</span> Состояние — только used to."]}, {"t": "Present Perfect Continuous", "rule": ["<b>have / has + been + глагол-ing</b> — действие началось в прошлом и продолжается до сих пор или только что закончилось, а результат виден. Акцент на <b>длительности</b>."], "ex": [["I have been waiting for an hour.", "Я жду уже час."], ["She has been working since morning.", "Она работает с утра."], ["It has been raining all day.", "Дождь идёт весь день."], ["How long have you been learning English?", "Как долго ты учишь английский?"], ["Your eyes are red. Have you been crying?", "У тебя красные глаза. Ты плакал?"]], "q": [{"q": "I ___ for you since six o'clock.", "o": ["have waited", "have been waiting", "am waiting"], "a": 1}, {"q": "It ___ all day, so the streets are wet.", "o": ["has been raining", "rains", "rained"], "a": 0}, {"q": "I have ___ three emails this morning.", "o": ["written", "been writing", "write"], "a": 0}, {"q": "She is tired. She ___ all day.", "o": ["has been working", "is working", "works"], "a": 0}, {"q": "We ___ here since 9 o'clock.", "o": ["have been sitting", "sit", "are sitting"], "a": 0}], "tbl": {"t": "Perfect и Perfect Continuous", "head": ["", "Perfect", "Perfect Continuous"], "rows": [["акцент", "результат", "процесс, длительность"], ["пример", "I have read 3 books.", "I have been reading for 2 hours."], ["вопрос", "How many?", "How long?"]]}, "when": ["for + период, since + точка отсчёта: <i>for 2 hours, since morning.</i>", "Усталость, следы: <i>I am tired. I have been running.</i>", "Состояния (know, like) не используют: <i>I have known her for years.</i>"], "tip": "если вопрос «как долго?» или есть for / since, а действие ещё идёт — Perfect Continuous.", "mist": ["<span class=\"x\">✗ I am waiting for an hour.</span> <span class=\"v\">✓ I have been waiting for an hour.</span> For + период — Perfect Continuous.", "<span class=\"x\">✗ I have been knowing her.</span> <span class=\"v\">✓ I have known her.</span> Know не употребляется в Continuous.", "<span class=\"x\">✗ How long do you learn?</span> <span class=\"v\">✓ How long have you been learning?</span> Нужна длительность до сегодня."]}, {"t": "Будущее: will, going to, Present Continuous", "rule": ["Будущее выражается разными способами. <b>will</b> — решение сейчас, прогноз, обещание. <b>be going to</b> — заранее принятый план или очевидный признак. <b>Present Continuous</b> — договорённость на ближайшее время."], "ex": [["I'll carry your bag.", "Я понесу твою сумку."], ["We are going to buy a car.", "Мы собираемся купить машину."], ["I am meeting Anna tonight.", "Я сегодня вечером встречаюсь с Анной."], ["Look! It is going to rain.", "Смотри! Будет дождь."], ["I think he will win.", "Думаю, он выиграет."]], "q": [{"q": "Oh, I forgot the milk! I ___ get some.", "o": ["will", "am going to", "am getting"], "a": 0}, {"q": "We have decided: we ___ move to Spain next year.", "o": ["will", "are going to", "move"], "a": 1}, {"q": "Look at those clouds! It ___ rain.", "o": ["will", "is going to", "rains"], "a": 1}, {"q": "— The phone is ringing. — I ___ it.", "o": ["answer", "will answer", "am going to answer"], "a": 1}, {"q": "I ___ my parents next weekend. (билет уже куплен)", "o": ["am visiting", "visit", "will visit"], "a": 0}], "tbl": {"t": "Выбор формы", "head": ["Форма", "Когда", "Пример"], "rows": [["will", "решаю сейчас, обещаю", "I'll help you."], ["going to", "план, намерение, очевидные признаки", "I am going to study. Look at the clouds, it is going to rain."], ["Present Continuous", "договорённость, время указано", "I am meeting Tom at 6."]]}, "when": ["Телефон звонит — <i>I'll answer it.</i> (will).", "Купил билеты — <i>I am going to fly to Rome.</i>", "Договорился с врачом — <i>I am seeing the doctor at 5.</i>"], "tip": "will — решение в момент речи; going to — уже решено; Continuous — уже договорено на ближайшее время.", "mist": ["<span class=\"x\">✗ I will to go.</span> <span class=\"v\">✓ I will go.</span> После will нет to.", "<span class=\"x\">✗ Look, it will rain!</span> <span class=\"v\">✓ Look, it is going to rain!</span> Есть очевидный признак.", "<span class=\"x\">✗ I will meet Tom at 6. (уже договорились)</span> <span class=\"v\">✓ I am meeting Tom at 6.</span> Договорённость — Continuous."]}, {"t": "Вопросительные хвосты (question tags)", "rule": ["Question tag — короткий вопрос в конце предложения («не так ли?»). Он просит подтверждения. Правило: <b>утверждение → отрицательный хвост</b>, <b>отрицание → положительный хвост</b>."], "ex": [["It is cold today, isn't it?", "Сегодня холодно, не так ли?"], ["You don't smoke, do you?", "Ты ведь не куришь?"], ["She speaks English, doesn't she?", "Она говорит по-английски, да?"], ["They will come, won't they?", "Они придут, правда?"], ["Open the door, will you?", "Открой дверь, ладно?"]], "q": [{"q": "You live here, ___?", "o": ["don't you", "do you", "aren't you"], "a": 0}, {"q": "He isn't late, ___?", "o": ["is he", "isn't he", "does he"], "a": 0}, {"q": "They have finished, ___?", "o": ["haven't they", "don't they", "have they"], "a": 0}, {"q": "You like pizza, ___?", "o": ["don't you", "do you", "aren't you"], "a": 0}, {"q": "He can't drive, ___?", "o": ["can't he", "can he", "does he"], "a": 1}], "tbl": {"t": "Примеры", "head": ["Основа", "Хвост"], "rows": [["You are tired,", "aren't you?"], ["She doesn't like tea,", "does she?"], ["They went home,", "didn't they?"], ["He can swim,", "can't he?"], ["I am late,", "aren't I?"], ["Let's go,", "shall we?"]]}, "when": ["Хвост строится по первому вспомогательному глаголу.", "Если вспомогательного нет — do / does / did.", "Падающая интонация — мы уверены, повышающаяся — действительно спрашиваем."], "tip": "зеркало: в основе плюс — в хвосте минус, и наоборот. Время и подлежащее те же.", "mist": ["<span class=\"x\">✗ You are tired, are you?</span> <span class=\"v\">✓ You are tired, aren't you?</span> Утверждение → хвост с not.", "<span class=\"x\">✗ She likes tea, doesn't it?</span> <span class=\"v\">✓ She likes tea, doesn't she?</span> Хвост согласуется с подлежащим.", "<span class=\"x\">✗ I am late, amn't I?</span> <span class=\"v\">✓ I am late, aren't I?</span> Особая форма для I am."]}, {"t": "Too и enough", "rule": ["<b>too + прилагательное</b> — слишком (в негативном смысле). <b>прилагательное + enough</b> — достаточно. <b>enough + существительное</b> — достаточное количество."], "ex": [["It is too cold to swim.", "Слишком холодно, чтобы купаться."], ["She is old enough to drive.", "Она достаточно взрослая, чтобы водить."], ["We have enough money.", "У нас достаточно денег."], ["This bag is too heavy.", "Эта сумка слишком тяжёлая."], ["The room is not big enough.", "Комната недостаточно большая."]], "q": [{"q": "The bag is ___ heavy for me to carry.", "o": ["too", "enough", "very much"], "a": 0}, {"q": "He is tall ___ to play basketball.", "o": ["enough", "too", "so"], "a": 0}, {"q": "We do not have ___ chairs.", "o": ["enough", "too", "enough of"], "a": 0}, {"q": "The soup is ___ hot. I can't eat it.", "o": ["too", "enough", "very much"], "a": 0}, {"q": "Do we have ___ chairs for everyone?", "o": ["enough", "too", "much"], "a": 0}], "tbl": {"t": "Конструкции", "head": ["Конструкция", "Пример", "Перевод"], "rows": [["too + adj (+ to do)", "too tired to walk", "слишком усталый, чтобы идти"], ["adj + enough (+ to do)", "old enough to vote", "достаточно взрослый, чтобы голосовать"], ["enough + noun", "enough money", "достаточно денег"], ["not + adj + enough", "not warm enough", "недостаточно тепло"]]}, "when": ["Too стоит перед прилагательным, enough — после него.", "Enough перед существительным: <i>enough time.</i>", "Too much / too many — слишком много: <i>too much sugar.</i>"], "tip": "too — перед прилагательным («перебор»), enough — после («достаточно»). Но с существительным enough ставим перед.", "mist": ["<span class=\"x\">✗ enough old</span> <span class=\"v\">✓ old enough</span> Enough идёт после прилагательного.", "<span class=\"x\">✗ too much cold</span> <span class=\"v\">✓ too cold</span> Перед прилагательным без much.", "<span class=\"x\">✗ I am enough tired.</span> <span class=\"v\">✓ I am tired enough. / I am very tired.</span> Enough не усиливает без смысла."]}]},
{"id": "B2", "name": "Выше среднего", "d": "Пассив и косвенная речь.", "lessons": [{"t": "Пассив и have something done", "rule": ["<b>Пассив</b> (<i>be + 3-я форма</i>) — когда важно действие или результат, а не кто его совершил: <i>The window was broken.</i> Исполнитель вводится через <b>by</b>.", "<b>have something done</b> — мы не делаем сами, а заказываем: <i>I had my hair cut.</i>"], "ex": [["This house was built in 1900.", "Этот дом построили в 1900 году."], ["English is spoken all over the world.", "На английском говорят по всему миру."], ["The report will be finished tomorrow.", "Отчёт закончат завтра."], ["I had my car repaired.", "Мне починили машину."], ["The film was directed by Nolan.", "Фильм снят Ноланом."]], "q": [{"q": "The window ___ by a ball yesterday.", "o": ["broke", "was broken", "has broke"], "a": 1}, {"q": "I ___ my hair cut last week.", "o": ["had", "have", "did"], "a": 0}, {"q": "The cake was decorated ___ fresh fruit.", "o": ["by", "with", "of"], "a": 1}, {"q": "The letter ___ yesterday.", "o": ["was sent", "sent", "is sent"], "a": 0}, {"q": "We ___ the roof ___ last week. (заказали ремонт)", "o": ["had / repaired", "have / repair", "were / repaired"], "a": 0}], "tbl": {"t": "Пассив по временам", "head": ["Время", "Форма", "Пример"], "rows": [["Present Simple", "am / is / are + V3", "The room is cleaned daily."], ["Past Simple", "was / were + V3", "The book was written in 1990."], ["Present Perfect", "has / have been + V3", "It has been fixed."], ["Future", "will be + V3", "It will be done."], ["Continuous", "is / was being + V3", "It is being built."]]}, "when": ["Исполнитель неизвестен или неважен: <i>My car was stolen.</i>", "Научный и официальный стиль.", "have something done — услуга: <i>She has her nails done every month.</i>"], "tip": "пассив = be + третья форма глагола. Время меняется только у be.", "mist": ["<span class=\"x\">✗ The car was stole.</span> <span class=\"v\">✓ The car was stolen.</span> Нужна 3-я форма.", "<span class=\"x\">✗ It is build now.</span> <span class=\"v\">✓ It is being built now.</span> В процессе: being + V3.", "<span class=\"x\">✗ I cut my hair. (в салоне)</span> <span class=\"v\">✓ I had my hair cut.</span> Не сам — have + V3."]}, {"t": "Косвенная речь", "rule": ["Косвенная речь передаёт слова другого человека. Если вводящий глагол в прошедшем (<i>said, told</i>), время в придаточном «сдвигается» на шаг назад, а местоимения и слова времени меняются по смыслу."], "ex": [["\"I am tired,\" he said. → He said he was tired.", "«Я устал», — сказал он."], ["\"I will help,\" she said. → She said she would help.", "«Я помогу», — сказала она."], ["\"Where do you live?\" → He asked where I lived.", "Он спросил, где я живу."], ["\"Are you ready?\" → She asked if I was ready.", "Она спросила, готов ли я."], ["\"Don't go!\" → He told me not to go.", "Он сказал мне не ходить."]], "q": [{"q": "«I am tired,» she said. → She said she ___ tired.", "o": ["is", "was", "has been"], "a": 1}, {"q": "«Where do you live?» → He asked me where I ___.", "o": ["lived", "did live", "do live"], "a": 0}, {"q": "«I will call you tomorrow.» → Tom said he ___ call me the next day.", "o": ["will", "would", "has"], "a": 1}, {"q": "\"I like it.\" → She said she ___ it.", "o": ["likes", "liked", "had liked"], "a": 1}, {"q": "\"Do you work?\" → He asked ___.", "o": ["if I worked", "do I work", "that I work"], "a": 0}], "tbl": {"t": "Сдвиг времён", "head": ["Прямая речь", "Косвенная"], "rows": [["Present Simple", "Past Simple"], ["Present Continuous", "Past Continuous"], ["Past Simple", "Past Perfect"], ["Present Perfect", "Past Perfect"], ["will", "would"], ["can", "could"]]}, "when": ["say + that: <i>He said that he was tired.</i>", "tell + человек: <i>He told me that…</i>", "Если сказанное всё ещё верно, сдвиг можно не делать."], "extra": {"t": "Другие изменения", "p": ["now → then; today → that day; yesterday → the day before; tomorrow → the next day; here → there; this → that.", "Вопросы: <i>He asked if / whether I was ready.</i> Порядок слов как в утверждении."]}, "tip": "say that — без человека, tell somebody that — с человеком. Время отодвигаем на шаг назад.", "mist": ["<span class=\"x\">✗ He said me that…</span> <span class=\"v\">✓ He told me that… / He said that…</span> Say без объекта, tell с объектом.", "<span class=\"x\">✗ He asked where do I live.</span> <span class=\"v\">✓ He asked where I lived.</span> В косвенном вопросе прямой порядок.", "<span class=\"x\">✗ She asked did I know.</span> <span class=\"v\">✓ She asked if I knew.</span> Нужны if / whether."]}, {"t": "Догадки: must, might, cannot", "rule": ["Модальные глаголы показывают уверенность говорящего: <b>must</b> — почти точно «наверняка», <b>might / may / could</b> — «возможно», <b>can't</b> — «не может быть»."], "ex": [["He must be at home. The light is on.", "Он, наверное, дома. Свет горит."], ["She might come later.", "Она, возможно, придёт позже."], ["That can't be true!", "Это не может быть правдой!"], ["They must have left already.", "Они, должно быть, уже ушли."], ["He can't have forgotten.", "Не может быть, чтобы он забыл."]], "q": [{"q": "The lights are on, so he ___ be at home.", "o": ["must", "cannot", "might not"], "a": 0}, {"q": "You have just had lunch. You ___ be hungry.", "o": ["must", "cannot", "might"], "a": 1}, {"q": "I am not sure, but Tom ___ come tonight.", "o": ["must", "might", "cannot"], "a": 1}, {"q": "The lights are off. They ___ be at home.", "o": ["can't", "mustn't", "don't"], "a": 0}, {"q": "She ___ have missed the bus. That's why she's late.", "o": ["must", "mustn't", "can't"], "a": 0}], "tbl": {"t": "Шкала уверенности", "head": ["Уверенность", "Настоящее", "Прошедшее"], "rows": [["~95% да", "must be", "must have been"], ["~50%", "might / may / could be", "might have been"], ["~95% нет", "can't be", "can't have been"]]}, "when": ["Вывод по признакам: <i>He is yawning. He must be tired.</i>", "Сомнение: <i>She might be at home.</i>", "Невозможно: <i>That can't be true!</i>", "Про прошлое: модальный + have + V3."], "tip": "для вывода «наверняка» — must, «возможно» — might, «не может быть» — can't.", "mist": ["<span class=\"x\">✗ He must to be tired.</span> <span class=\"v\">✓ He must be tired.</span> После must нет to.", "<span class=\"x\">✗ It mustn't be true.</span> <span class=\"v\">✓ It can't be true.</span> Для вывода «не может быть» берём can't.", "<span class=\"x\">✗ She might been there.</span> <span class=\"v\">✓ She might have been there.</span> Нужно have + V3."]}, {"t": "Относительные придаточные: who, which, whose, where", "rule": ["Придаточные с who, which, whose, where уточняют существительное. <b>who</b> — человек, <b>which</b> — вещь, <b>that</b> — и человек, и вещь, <b>whose</b> — чей, <b>where</b> — место."], "ex": [["The man who called you is my boss.", "Мужчина, который тебе звонил, мой начальник."], ["This is the book that I told you about.", "Это книга, о которой я тебе говорил."], ["She is the girl whose bag was stolen.", "Это девушка, у которой украли сумку."], ["That is the café where we met.", "Вот кафе, где мы познакомились."], ["My sister, who lives in Spain, is a nurse.", "Моя сестра, которая живёт в Испании, медсестра."]], "q": [{"q": "The man ___ lives next door is a doctor.", "o": ["who", "which", "whose"], "a": 0}, {"q": "This is the book ___ I told you about.", "o": ["who", "which", "where"], "a": 1}, {"q": "She is the girl ___ father is a pilot.", "o": ["who", "whose", "which"], "a": 1}, {"q": "The house ___ I grew up is far from here.", "o": ["where", "who", "whose"], "a": 0}, {"q": "The woman ___ car was stolen called the police.", "o": ["whose", "who", "which"], "a": 0}], "tbl": {"t": "Слова-связки", "head": ["Слово", "К чему относится", "Пример"], "rows": [["who", "люди", "the man who called"], ["which", "вещи, животные", "the book which I read"], ["that", "люди и вещи", "the book that I read"], ["whose", "принадлежность", "the girl whose bag…"], ["where", "место", "the city where I live"]]}, "when": ["Объект можно опустить в определяющем придаточном: <i>The book (that) I bought…</i>", "Подлежащее опускать нельзя: <i>The man who called…</i>", "После предлога: <i>The man I spoke to.</i>"], "extra": {"t": "Определяющие и описательные", "p": ["<b>Определяющие</b> (без запятых) — нужны для смысла: <i>The man who lives next door is a doctor.</i>", "<b>Описательные</b> (с запятыми) — дополнительная информация, that не используется: <i>My brother, who lives in Rome, is a doctor.</i>"]}, "tip": "who — люди, which — вещи, whose — чей, where — место. That — универсальный в определяющих.", "mist": ["<span class=\"x\">✗ The man which called…</span> <span class=\"v\">✓ The man who called…</span> Для людей who.", "<span class=\"x\">✗ The girl who her bag…</span> <span class=\"v\">✓ The girl whose bag…</span> Принадлежность — whose.", "<span class=\"x\">✗ My brother, that lives…</span> <span class=\"v\">✓ My brother, who lives…</span> В описательных нет that."]}, {"t": "Связки: although, despite, however", "rule": ["Связки соединяют идеи и показывают противопоставление. <b>although / even though + предложение</b>, <b>despite / in spite of + существительное или -ing</b>, <b>however</b> — отдельное предложение, «однако»."], "ex": [["Although it rained, we had a picnic.", "Хотя шёл дождь, мы устроили пикник."], ["Despite the rain, we had a picnic.", "Несмотря на дождь, мы устроили пикник."], ["She is tired. However, she keeps working.", "Она устала. Однако продолжает работать."], ["In spite of being ill, he went to work.", "Несмотря на болезнь, он пошёл на работу."], ["Even though he is rich, he is not happy.", "Хотя он богат, он не счастлив."]], "q": [{"q": "___ it was raining, we went for a walk.", "o": ["Despite", "Although", "However"], "a": 1}, {"q": "___ the rain, we went for a walk.", "o": ["Despite", "Although", "Therefore"], "a": 0}, {"q": "He was tired. ___, he finished the work.", "o": ["Although", "However", "Despite"], "a": 1}, {"q": "___ he was tired, he finished the work.", "o": ["Although", "Despite", "However"], "a": 0}, {"q": "___ the traffic, we arrived on time.", "o": ["Although", "Despite", "However"], "a": 1}], "tbl": {"t": "Что после чего", "head": ["Связка", "После неё", "Пример"], "rows": [["although", "подлежащее + глагол", "Although it was cold, we went out."], ["despite", "существительное / -ing", "Despite the cold, we went out."], ["in spite of", "существительное / -ing", "In spite of being tired, he worked."], ["however", "запятая и новое предложение", "It was cold. However, we went out."]]}, "when": ["Контраст: ожидали одно, получилось другое.", "however часто в начале предложения с запятой после него.", "but и although нельзя ставить вместе: <i>Although it was cold, we went out.</i>"], "tip": "although + целое предложение, despite + существительное. Хочешь despite + предложение — добавь the fact that.", "mist": ["<span class=\"x\">✗ Despite it was cold…</span> <span class=\"v\">✓ Despite the cold… / Although it was cold…</span> После despite нет подлежащего + глагола.", "<span class=\"x\">✗ Although it rained, but we went.</span> <span class=\"v\">✓ Although it rained, we went.</span> Не используем although и but вместе.", "<span class=\"x\">✗ Despite of the rain</span> <span class=\"v\">✓ Despite the rain / In spite of the rain</span> После despite нет of."]}, {"t": "Past Perfect", "rule": ["<b>Past Perfect</b> (<i>had + 3-я форма</i>) — действие, которое произошло <b>раньше</b> другого прошлого действия. Это «прошлое в прошлом»."], "ex": [["When I came, she had left.", "Когда я пришёл, она уже ушла."], ["He said he had seen it.", "Он сказал, что видел это."], ["After I had eaten, I went out.", "После того как поел, я вышел."], ["By the time we got there, the shop had closed.", "К тому времени, как мы добрались, магазин закрылся."], ["Had you met him before?", "Ты встречал его раньше?"]], "q": [{"q": "When we arrived, the film ___ already.", "o": ["started", "had started", "was starting"], "
