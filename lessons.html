king", "lock"], "a": 0}, {"q": "I remember ___ this film as a child. (помню, что видел)", "o": ["seeing", "to see", "see"], "a": 0}, {"q": "I remember ___ him last year. (я видел)", "o": ["to see", "seeing", "see"], "a": 1}, {"q": "Don't forget ___ the lights.", "o": ["to turn off", "turning off", "turn off"], "a": 0}], "tbl": {"t": "Пары с разным смыслом", "head": ["Глагол", "+ to do", "+ doing"], "rows": [["remember", "помнить, что нужно сделать", "помнить, что сделал"], ["forget", "забыть сделать", "забыть, что сделал"], ["stop", "остановиться, чтобы сделать", "прекратить делать"], ["try", "пытаться", "пробовать (в качестве эксперимента)"], ["regret", "сожалеть, сообщая (to tell)", "сожалеть о сделанном"]]}, "when": ["Намерение/будущее → to do.", "Событие уже произошло → doing.", "stop to smoke — остановиться, чтобы покурить; stop smoking — бросить курить."], "tip": "to do — действие впереди (ещё не сделано), doing — действие уже было.", "mist": ["<span class=\"x\">✗ I forgot buying milk. (нужно было купить)</span> <span class=\"v\">✓ I forgot to buy milk.</span> Забыл сделать.", "<span class=\"x\">✗ He stopped to smoke. (бросил)</span> <span class=\"v\">✓ He stopped smoking.</span> Прекратил делать.", "<span class=\"x\">✗ I try to open it, but it is stuck.</span> <span class=\"v\">✓ I tried to open it.</span> Пытаться — to do."]}, {"t": "Used to, be used to, get used to", "rule": ["Три похожие конструкции с разным смыслом. <b>used to + глагол</b> — раньше (больше нет). <b>be used to + -ing / noun</b> — привык. <b>get used to + -ing / noun</b> — привыкаю, процесс привыкания."], "ex": [["I used to live in London.", "Раньше я жил в Лондоне."], ["I am used to getting up early.", "Я привык рано вставать."], ["She is getting used to the cold.", "Она привыкает к холоду."], ["He soon got used to the new job.", "Он скоро привык к новой работе."], ["Are you used to driving on the left?", "Ты привык ездить по левой стороне?"]], "q": [{"q": "I am used to ___ up early.", "o": ["get", "getting", "got"], "a": 1}, {"q": "It took me a month to get used to ___ in the city.", "o": ["live", "living", "lived"], "a": 1}, {"q": "We ___ play chess every weekend, but we do not now.", "o": ["used to", "are used to", "get used to"], "a": 0}, {"q": "I ___ drink coffee, but now I prefer tea.", "o": ["used to", "am used to", "get used to"], "a": 0}, {"q": "It was hard, but I finally got used to ___ in the city.", "o": ["live", "living", "lived"], "a": 1}], "tbl": {"t": "Сравнение", "head": ["Конструкция", "Смысл", "Пример"], "rows": [["used to + V", "раньше", "I used to smoke."], ["be used to + V-ing", "привык", "I am used to getting up early."], ["get used to + V-ing", "привыкаю", "I am getting used to the cold."]]}, "when": ["Нужно отличать глагол после used to от -ing после be/get used to.", "be used to + noun: <i>I am used to the noise.</i>"], "tip": "есть am / is / are или get — после to ставим -ing. Только used to без be/get — после неё обычный глагол.", "mist": ["<span class=\"x\">✗ I am used to live alone.</span> <span class=\"v\">✓ I am used to living alone.</span> После used to (привык) нужен -ing.", "<span class=\"x\">✗ I used to getting up early.</span> <span class=\"v\">✓ I am used to getting up early.</span> Привычка в настоящем — be used to.", "<span class=\"x\">✗ I got used live here.</span> <span class=\"v\">✓ I got used to living here.</span> Нужны to и -ing."]}, {"t": "Had better и would rather", "rule": ["<b>had better + глагол</b> — «лучше бы», сильный совет с предупреждением о последствиях. <b>would rather + глагол</b> — «предпочёл бы». Оба варианта без to."], "ex": [["You had better see a doctor.", "Тебе лучше сходить к врачу."], ["We had better hurry.", "Нам лучше поторопиться."], ["I would rather stay at home.", "Я бы предпочёл остаться дома."], ["She would rather not go.", "Она предпочла бы не ходить."], ["I would rather you stayed.", "Я бы предпочёл, чтобы ты остался."]], "q": [{"q": "You ___ see a doctor.", "o": ["had better", "would better", "have better"], "a": 0}, {"q": "I would rather ___ at home tonight.", "o": ["stay", "to stay", "staying"], "a": 0}, {"q": "I would rather you ___ here.", "o": ["don't smoke", "didn't smoke", "won't smoke"], "a": 1}, {"q": "You ___ leave now, or you will miss the train.", "o": ["had better", "would rather", "should to"], "a": 0}, {"q": "I ___ not go to the party.", "o": ["would rather", "had better to", "am better"], "a": 0}], "tbl": {"t": "Формы", "head": ["Конструкция", "Смысл", "Пример"], "rows": [["had better (not)", "лучше (не)", "You had better go."], ["would rather (not)", "предпочту (не)", "I would rather stay."], ["would rather + кто-то + Past Simple", "предпочёл бы, чтобы он…", "I would rather you stayed."]]}, "when": ["had better — про конкретную ситуацию, не общий совет (для общего — should).", "would rather than: <i>I would rather walk than drive.</i>", "Отрицание: <i>You had better not be late.</i>"], "tip": "had better — «лучше сделай, а то…», would rather — «предпочитаю». Оба без to.", "mist": ["<span class=\"x\">✗ You had better to go.</span> <span class=\"v\">✓ You had better go.</span> Нет to.", "<span class=\"x\">✗ You had not better go.</span> <span class=\"v\">✓ You had better not go.</span> Not ставим после better.", "<span class=\"x\">✗ I would rather to stay.</span> <span class=\"v\">✓ I would rather stay.</span> После rather нет to."]}]},
{"id": "C1", "name": "Продвинутый", "d": "Инверсия и нереальное прошедшее.", "lessons": [{"t": "Инверсия", "rule": ["Инверсия — обратный порядок слов (<b>вспомогательный глагол + подлежащее</b>) после отрицательных и ограничительных выражений в начале предложения. Звучит формально, подчёркивает мысль."], "ex": [["Never have I felt so happy.", "Никогда я не чувствовал себя таким счастливым."], ["Rarely does she complain.", "Она редко жалуется."], ["Hardly had we sat down when the phone rang.", "Едва мы сели, как зазвонил телефон."], ["Not only did he lie, but he also stole.", "Он не только солгал, но и украл."], ["Little did they know the truth.", "Они и не подозревали правды."]], "q": [{"q": "Rarely ___ such a beautiful view.", "o": ["I have seen", "have I seen", "I saw"], "a": 1}, {"q": "No sooner had she left ___ it started to rain.", "o": ["when", "than", "then"], "a": 1}, {"q": "Not only ___ late, but he forgot the documents.", "o": ["he was", "was he", "did he"], "a": 1}, {"q": "Never ___ such a beautiful place.", "o": ["I have seen", "have I seen", "I saw"], "a": 1}, {"q": "No sooner had he left ___ it started to rain.", "o": ["than", "when", "that"], "a": 0}], "tbl": {"t": "Частые начала", "head": ["Начало", "Пример"], "rows": [["Never", "Never have I seen such a view."], ["Rarely / Seldom", "Rarely does he complain."], ["Hardly … when", "Hardly had we left when it rained."], ["No sooner … than", "No sooner had she arrived than it began."], ["Not only … but also", "Not only did he win, but he also broke the record."], ["Only then / Only after", "Only then did I understand."], ["Little", "Little did he know."]]}, "when": ["Письменная и торжественная речь.", "Подчёркивание: нечто необычное, редкое.", "Если вспомогательного нет — do / does / did."], "tip": "отрицательное слово в начале → вспомогательный глагол идёт вперёд подлежащего, как в вопросе.", "mist": ["<span class=\"x\">✗ Never I have seen it.</span> <span class=\"v\">✓ Never have I seen it.</span> После отрицательного слова — инверсия.", "<span class=\"x\">✗ Rarely she complains.</span> <span class=\"v\">✓ Rarely does she complain.</span> Нужен does.", "<span class=\"x\">✗ Hardly we had left when…</span> <span class=\"v\">✓ Hardly had we left when…</span> Had перед подлежащим."]}, {"t": "Wish и нереальное прошедшее", "rule": ["<b>wish</b> выражает сожаление или желание изменить реальность. Время после wish «отступает» на шаг назад: <b>wish + Past Simple</b> (о настоящем), <b>wish + Past Perfect</b> (о прошлом), <b>wish + would</b> (раздражение, просьба)."], "ex": [["I wish I had a car.", "Жаль, что у меня нет машины."], ["She wishes she had told the truth.", "Она жалеет, что не сказала правду."], ["I wish it would stop raining.", "Хотел бы я, чтобы дождь перестал."], ["If only I knew the answer!", "Если бы я знал ответ!"], ["I wish I were on a beach now.", "Хотел бы я оказаться сейчас на пляже."]], "q": [{"q": "I wish I ___ more free time now.", "o": ["have", "had", "would have"], "a": 1}, {"q": "I wish I ___ harder last year.", "o": ["studied", "had studied", "would study"], "a": 1}, {"q": "It's time we ___.", "o": ["leave", "left", "will leave"], "a": 1}, {"q": "I wish I ___ speak French. (но не умею)", "o": ["can", "could", "would"], "a": 1}, {"q": "He wishes he ___ the exam. (но провалил)", "o": ["passed", "had passed", "would pass"], "a": 1}], "tbl": {"t": "Три модели", "head": ["Про что", "Конструкция", "Пример"], "rows": [["настоящее", "wish + Past Simple", "I wish I had more time."], ["прошлое", "wish + Past Perfect", "I wish I had studied."], ["чужое поведение", "wish + would", "I wish he would stop."]]}, "when": ["After wish используем were для всех лиц: <i>I wish I were taller.</i>", "If only — более эмоциональный вариант wish.", "Would не используется, когда подлежащее одно и то же: <i>I wish I could swim.</i>"], "tip": "wish — это «нереальный» разговор. Сдвигаем время на шаг назад: настоящее → Past Simple, прошлое → Past Perfect.", "mist": ["<span class=\"x\">✗ I wish I have a car.</span> <span class=\"v\">✓ I wish I had a car.</span> После wish — Past Simple.", "<span class=\"x\">✗ I wish I would know.</span> <span class=\"v\">✓ I wish I knew.</span> Would — не для собственных состояний.", "<span class=\"x\">✗ I wish I studied. (в прошлом)</span> <span class=\"v\">✓ I wish I had studied.</span> Про прошлое — Past Perfect."]}, {"t": "Эмфаза: What… и It was… that", "rule": ["Расщеплённые предложения (cleft sentences) выделяют главное. <b>What … is</b> выделяет предмет: <i>What I need is a rest.</i> <b>It is / was … that</b> выделяет любой член: <i>It was Tom that broke the window.</i>"], "ex": [["What I want is a quiet place.", "Мне нужно именно тихое место."], ["It was Anna who called me.", "Мне позвонила именно Анна."], ["It was in Paris that we met.", "Именно в Париже мы встретились."], ["What annoys me is his attitude.", "Меня раздражает именно его отношение."], ["All I want is to sleep.", "Всё, чего я хочу, — это спать."]], "q": [{"q": "What I need ___ a holiday.", "o": ["are", "is", "do"], "a": 1}, {"q": "___ was Maria who called me.", "o": ["It", "What", "That"], "a": 0}, {"q": "It was in Paris ___ they met.", "o": ["what", "that", "who"], "a": 1}, {"q": "___ I really need is a holiday.", "o": ["What", "That", "Which"], "a": 0}, {"q": "It was my brother ___ broke the vase.", "o": ["who", "what", "when"], "a": 0}], "tbl": {"t": "Две модели", "head": ["Модель", "Пример", "Выделяем"], "rows": [["What + подлежащее + глагол + is / was", "What I need is sleep.", "предмет/цель"], ["It is / was + элемент + that …", "It was yesterday that I met her.", "время, место, человека"], ["The reason why … is that …", "The reason why I left is that…", "причину"]]}, "when": ["Хочется сделать акцент: «именно это».", "Исправление: <i>It wasn't Tom, it was Anna who called.</i>", "В разговорной речи, в публичных выступлениях."], "tip": "эмфаза — как жирный шрифт в речи. Ставим нужное слово после «It is / was» или в конец «What… is».", "mist": ["<span class=\"x\">✗ What I need it is rest.</span> <span class=\"v\">✓ What I need is rest.</span> Не повторяем it.", "<span class=\"x\">✗ It was Tom what broke it.</span> <span class=\"v\">✓ It was Tom who broke it.</span> Для людей — who или that.", "<span class=\"x\">✗ It was yesterday when I met her.</span> <span class=\"v\">✓ It was yesterday that I met her.</span> Используем that."]}, {"t": "Смешанные условные", "rule": ["Смешанные условные соединяют разные времена: условие в прошлом, а результат в настоящем — или наоборот."], "ex": [["If I had taken that job, I would be rich now.", "Если бы я согласился на ту работу, сейчас был бы богат."], ["If she were braver, she would have said it.", "Будь она смелее, она бы это сказала."], ["If we had left earlier, we would be there now.", "Если бы мы выехали раньше, были бы уже там."], ["If he weren't so shy, he would have asked.", "Если бы он не был таким застенчивым, он бы спросил."], ["If I hadn't met you, I wouldn't be so happy.", "Если бы я не встретил тебя, не был бы так счастлив."]], "q": [{"q": "If I had taken the job, I ___ rich now.", "o": ["would be", "would have been", "will be"], "a": 0}, {"q": "If she were more careful, she ___ the glass.", "o": ["would not have broken", "would not break", "will not break"], "a": 0}, {"q": "If we had left earlier, we ___ late now.", "o": ["would not be", "would not have been", "will not be"], "a": 0}, {"q": "If I had listened, I ___ in trouble now.", "o": ["wouldn't be", "wouldn't have been", "won't be"], "a": 0}, {"q": "If I were taller, I ___ basketball then.", "o": ["would have played", "would play", "will play"], "a": 0}], "tbl": {"t": "Два варианта", "head": ["Условие", "Результат", "Пример"], "rows": [["Past Perfect (прошлое)", "would + глагол (сейчас)", "If I had studied, I would be a doctor now."], ["Past Simple (сейчас)", "would have + V3 (прошлое)", "If I were rich, I would have bought it."]]}, "when": ["Прошлое решение влияет на настоящее.", "Постоянное состояние влияет на прошлое действие.", "Часто со словами now, today, still."], "tip": "сначала определи время условия, потом время результата — они могут быть разными.", "mist": ["<span class=\"x\">✗ If I had money, I would have bought it.</span> <span class=\"v\">✓ If I had had money, I would have bought it.</span> Прошлое условие — Past Perfect.", "<span class=\"x\">✗ If I studied then…</span> <span class=\"v\">✓ If I had studied then…</span> Для прошлого условие в Past Perfect.", "<span class=\"x\">✗ I would be rich if I would take it.</span> <span class=\"v\">✓ I would be rich if I had taken it.</span> Would только в главной части."]}, {"t": "Причастные обороты", "rule": ["Причастные обороты заменяют придаточные и делают речь компактнее. <b>Present participle (-ing)</b> — одновременное действие или причина, <b>Past participle (V3)</b> — пассивное значение, <b>Perfect participle (having + V3)</b> — действие произошло раньше."], "ex": [["Opening the door, I saw a cat.", "Открыв дверь, я увидел кошку."], ["Having eaten, they left.", "Поев, они ушли."], ["Written in 1850, the book is still popular.", "Написанная в 1850 году, книга до сих пор популярна."], ["Not knowing the answer, he stayed silent.", "Не зная ответа, он молчал."], ["Feeling ill, she stayed at home.", "Плохо себя чувствуя, она осталась дома."]], "q": [{"q": "___ the report, she went home.", "o": ["Having finished", "Finished to", "Finish"], "a": 0}, {"q": "___ down the street, I met an old friend.", "o": ["Walked", "Walking", "To walk"], "a": 1}, {"q": "___ the news, he called his mother.", "o": ["Hearing", "Heard to", "To hear"], "a": 0}, {"q": "___ the report, she sent it.", "o": ["Finishing", "Having finished", "Finished"], "a": 1}, {"q": "___ in Italy, the car is very fast.", "o": ["Made", "Making", "Make"], "a": 0}], "tbl": {"t": "Формы", "head": ["Форма", "Смысл", "Пример"], "rows": [["V-ing", "одновременно / причина", "Walking home, I met Tom."], ["V3", "пассив", "Seen from above, it looks small."], ["Having + V3", "раньше", "Having finished, he left."]]}, "when": ["Подлежащее главного предложения должно совпадать с «тем, кто делает» в обороте.", "Часто в письменной речи.", "Заменяют because / as / when: <i>Feeling tired, she went to bed.</i>"], "tip": "подлежащее у оборота и у главного предложения должно быть одним и тем же человеком.", "mist": ["<span class=\"x\">✗ Walking home, the rain started.</span> <span class=\"v\">✓ Walking home, I got wet.</span> Подлежащее должно совпадать.", "<span class=\"x\">✗ Having ate, he left.</span> <span class=\"v\">✓ Having eaten, he left.</span> Нужна V3.", "<span class=\"x\">✗ Know the answer, he spoke.</span> <span class=\"v\">✓ Knowing the answer, he spoke.</span> Нужен -ing."]}, {"t": "Future Continuous и Future Perfect", "rule": ["<b>Future Continuous</b> (<i>will be + V-ing</i>) — процесс в конкретный момент будущего. <b>Future Perfect</b> (<i>will have + V3</i>) — действие, которое завершится к определённому моменту."], "ex": [["This time next week I will be flying to Rome.", "В это время на следующей неделе я буду лететь в Рим."], ["By Friday I will have finished the report.", "К пятнице я закончу отчёт."], ["Will you be using your laptop tonight?", "Ты будешь сегодня вечером пользоваться ноутбуком?"], ["In 2030 she will have lived here for 20 years.", "В 2030 году она проживёт здесь 20 лет."], ["Don't call at 9. I will be sleeping.", "Не звони в 9. Я буду спать."]], "q": [{"q": "This time tomorrow I ___ to Rome.", "o": ["will fly", "will be flying", "will have flown"], "a": 1}, {"q": "By Friday I ___ the report.", "o": ["will finish", "will have finished", "will be finishing"], "a": 1}, {"q": "By 2030 they ___ the bridge.", "o": ["will build", "will have built", "are building"], "a": 1}, {"q": "At noon tomorrow I ___ in a meeting.", "o": ["will be sitting", "will have sat", "sit"], "a": 0}, {"q": "By next June, we ___ married for ten years.", "o": ["will be", "will have been", "are"], "a": 1}], "tbl": {"t": "Сравнение", "head": ["Время", "Формула", "Пример"], "rows": [["Future Continuous", "will be + V-ing", "At 8 tomorrow I will be working."], ["Future Perfect", "will have + V3", "By 8 tomorrow I will have finished."]]}, "when": ["Continuous: «в это время я буду что-то делать».", "Perfect: «к этому времени уже будет сделано», часто с by / by the time.", "Вежливый вопрос о планах: <i>Will you be using the car?</i>"], "tip": "будет в процессе — be + V-ing; будет уже готово — have + V3.", "mist": ["<span class=\"x\">✗ By Friday I will be finishing.</span> <span class=\"v\">✓ By Friday I will have finished.</span> By + момент → Perfect.", "<span class=\"x\">✗ At 8 I will have worked.</span> <span class=\"v\">✓ At 8 I will be working.</span> Процесс — Continuous.", "<span class=\"x\">✗ I will have finish.</span> <span class=\"v\">✓ I will have finished.</span> Нужна V3."]}, {"t": "Пассив с вводными глаголами", "rule": ["Безличные пассивные конструкции передают общеизвестную или неподтверждённую информацию. Они типичны для новостей и научных текстов. <b>It is said that …</b> или <b>подлежащее + is said to …</b>."], "ex": [["He is said to be very rich.", "Говорят, он очень богат."], ["It is believed that the earth is 4.5 billion years old.", "Считается, что Земле 4,5 млрд лет."], ["She is thought to have left the country.", "Считают, что она покинула страну."], ["The prices are expected to rise.", "Ожидается, что цены вырастут."], ["They are known to be friendly.", "Известно, что они дружелюбны."]], "q": [{"q": "It ___ that the company will close.", "o": ["says", "is said", "said"], "a": 1}, {"q": "He is said ___ very rich.", "o": ["to be", "being", "be"], "a": 0}, {"q": "She is believed ___ the country last year.", "o": ["to have left", "to leave", "leaving"], "a": 0}, {"q": "The minister is reported ___ resigned.", "o": ["to have", "having", "that has"], "a": 0}, {"q": "It ___ that the film will win.", "o": ["is expected", "expected", "expects"], "a": 0}], "tbl": {"t": "Две конструкции", "head": ["Схема", "Пример"], "rows": [["It + passive + that …", "It is believed that he is rich."], ["Subject + passive + to + V", "He is believed to be rich."], ["Subject + passive + to have + V3", "He is said to have left."]]}, "when": ["Слухи, новости: <i>The company is reported to be losing money.</i>", "Прошлое: to have + V3.", "Процесс: to be + V-ing."], "extra": {"t": "Частые глаголы", "p": ["say, believe, think, know, expect, report, consider, understand, suppose, claim."]}, "tip": "две схемы: либо «It is said that…», либо «He is said to…». Смешивать нельзя.", "mist": ["<span class=\"x\">✗ He is said that he is rich.</span> <span class=\"v\">✓ He is said to be rich. / It is said that he is rich.</span> Две схемы не смешиваем.", "<span class=\"x\">✗ She is believed leave.</span> <span class=\"v\">✓ She is believed to have left.</span> Нужны to have + V3.", "<span class=\"x\">✗ It said that…</span> <span class=\"v\">✓ It is said that…</span> Нужна форма be."]}]},
{"id": "C2", "name": "Мастерство", "d": "Тонкости стиля и формальная грамматика.", "lessons": [{"t": "Сослагательное наклонение", "rule": ["Сослагательное наклонение (subjunctive) используется в формальном стиле после глаголов и выражений, которые просят, предлагают, требуют. Форма: <b>that + подлежащее + глагол в начальной форме</b> (без -s и без should)."], "ex": [["I suggest that he leave now.", "Я предлагаю, чтобы он ушёл сейчас."], ["It is vital that she be informed.", "Крайне важно, чтобы её проинформировали."], ["The teacher demanded that we be quiet.", "Учитель потребовал, чтобы мы были тише."], ["They insisted that he not go.", "Они настаивали, чтобы он не ходил."], ["If I were you, I would wait.", "На твоём месте я бы подождал."]], "q": [{"q": "The manager insisted that he ___ on time.", "o": ["arrives", "arrive", "arrived"], "a": 1}, {"q": "It is vital that every student ___ the form.", "o": ["signs", "sign", "signed"], "a": 1}, {"q": "If I ___ you, I would apologise.", "o": ["were", "was", "am"], "a": 0}, {"q": "The boss insists that everyone ___ on time.", "o": ["arrives", "arrive", "arrived"], "a": 1}, {"q": "It is essential that he ___ the rules.", "o": ["follows", "follow", "following"], "a": 1}], "tbl": {"t": "После чего", "head": ["Тип", "Примеры", "Пример"], "rows": [["глаголы", "suggest, recommend, insist, demand, require", "I suggest that he leave."], ["прилагательные", "essential, vital, important, necessary", "It is essential that she be present."], ["If it were / were to", "нереальное условие", "If I were you…"]]}, "when": ["Официальные письма, законы, договоры.", "В британском английском часто через should: <i>I suggest that he should leave.</i>", "Отрицание: not перед глаголом."], "tip": "после suggest / insist / demand и т.п. глагол остаётся в начальной форме для всех лиц.", "mist": ["<span class=\"x\">✗ I suggest that he leaves.</span> <span class=\"v\">✓ I suggest that he leave.</span> Нет окончания -s.", "<span class=\"x\">✗ It is vital that she is informed.</span> <span class=\"v\">✓ It is vital that she be informed.</span> Начальная форма be.", "<span class=\"x\">✗ They insisted that he doesn't go.</span> <span class=\"v\">✓ They insisted that he not go.</span> Not без do."]}, {"t": "Формальный и нейтральный стиль", "rule": ["Стиль определяет лексику и грамматику. Формальный — для писем, документов, презентаций. Нейтральный/разговорный — для друзей и коллег. Нужно уметь переключаться."], "ex": [["I am writing to enquire about the position.", "Пишу, чтобы узнать о вакансии."], ["Could you let me know?", "Не могли бы вы сообщить мне?"], ["We regret to inform you…", "С сожалением сообщаем вам…"], ["Thanks a lot! — Thank you very much.", "Спасибо огромное! — Благодарю вас."], ["Please find the document attached.", "Документ приложен к письму."]], "q": [{"q": "Формальный вариант слова «get»:", "o": ["obtain", "take", "catch"], "a": 0}, {"q": "Более формально: «We need your passport.»", "o": ["We want your passport.", "We require your passport.", "We hope for your passport."], "a": 1}, {"q": "Формальный вариант «find out»:", "o": ["look up", "figure out", "ascertain"], "a": 2}, {"q": "Which is more formal?", "o": ["I want to buy it.", "I wish to purchase it.", "I gonna get it."], "a": 1}, {"q": "Choose the formal opening:", "o": ["Hey,", "Dear Mr Smith,", "Yo,"], "a": 1}], "tbl": {"t": "Сравнение", "head": ["Разговорный", "Формальный"], "rows": [["get", "obtain, receive"], ["ask for", "request"], ["buy", "purchase"], ["start", "commence"], ["help", "assist"], ["need", "require"], ["about", "approximately"], ["I'm sorry", "I apologise"]]}, "when": ["Деловая переписка, резюме, заявления.", "Разговорный: сообщения друзьям, неформальные письма.", "Один и тот же смысл — разные слова."], "extra": {"t": "Грамматика формального стиля", "p": ["Нет сокращений (<i>do not</i>, а не <i>don't</i>); пассив чаще; предлог перед whom: <i>to whom it may concern</i>; безличные конструкции: <i>It is recommended that…</i>" uld be improved.</i>", "Деловые переговоры."], "tip": "вместо «Это так» — «Похоже, что это так». Одна-две смягчающие формы в предложении.", "mist": ["<span class=\"x\">✗ This is wrong.</span> <span class=\"v\">✓ This seems to be incorrect.</span> Смягчаем.", "<span class=\"x\">✗ It is definitely the cause.</span> <span class=\"v\">✓ It is probably the cause.</span> Нет уверенности — не используем definitely.", "<span class=\"x\">✗ This proves that…</span> <span class=\"v\">✓ This suggests that…</span> В академическом тексте — осторожнее."]}, {"t": "Отглагольные существительные в формальном стиле", "rule": ["Формальный и академический стиль любит существительные вместо глаголов (номинализация). Фраза становится компактной и «деловой»: <i>They decided → Their decision</i>."], "ex": [["They decided quickly. → Their quick decision surprised us.", "Их быстрое решение удивило нас."], ["The rise in prices worried people.", "Рост цен беспокоил людей."], ["His arrival caused a stir.", "Его приезд вызвал переполох."], ["There has been an improvement in sales.", "Продажи улучшились."], ["The discovery changed science.", "Открытие изменило науку."]], "q": [{"q": "Noun from decide:", "o": ["decision", "decider", "deciding"], "a": 0}, {"q": "The ___ of the new system took two years. (develop)", "o": ["development", "developing", "developed"], "a": 0}, {"q": "Her ___ to attend surprised everyone. (refuse)", "o": ["refusal", "refusing", "refused"], "a": 0}, {"q": "Her ___ to win the prize surprised everyone. (fail)", "o": ["failing", "failure", "fail"], "a": 1}, {"q": "Choose the more formal phrase:", "o": ["They decided fast.", "Their swift decision", "They made up their mind"], "a": 1}], "tbl": {"t": "Глагол → существительное", "head": ["Глагол", "Существительное"], "rows": [["decide", "decision"], ["develop", "development"], ["improve", "improvement"], ["analyse", "analysis"], ["arrive", "arrival"], ["fail", "failure"], ["introduce", "introduction"], ["discover", "discovery"]]}, "when": ["Научные статьи, официальные отчёты.", "Вместо длинного придаточного: <i>The fact that prices rose… → The rise in prices…</i>", "Следите за читаемостью: слишком много номинализаций делают текст тяжёлым."], "tip": "формальный стиль «тяжёлый на существительные»: ищи глагол, который можно превратить в существительное.", "mist": ["<span class=\"x\">✗ The decide was fast.</span> <span class=\"v\">✓ The decision was fast.</span> Нужно существительное.", "<span class=\"x\">✗ Her fail surprised us.</span> <span class=\"v\">✓ Her failure surprised us.</span> Failure — существительное.", "<span class=\"x\">✗ the develop of the city</span> <span class=\"v\">✓ the development of the city</span> Правильный суффикс -ment."]}, {"t": "Инверсия в условных: Had, Should, Were", "rule": ["В формальном стиле if можно опустить, поставив вспомогательный глагол в начало: <b>Had</b> (тип 3), <b>Were</b> (тип 2), <b>Should</b> (вероятное, но маловероятное)."], "ex": [["Had I known, I would have come.", "Если бы я знал, я бы пришёл."], ["Were he here, he would help us.", "Будь он здесь, он бы помог."], ["Should you need help, call me.", "Если вам понадобится помощь, позвоните."], ["Had they not left early, they would have missed it.", "Если бы они не ушли рано, то опоздали бы."], ["Should anything happen, let us know.", "Если что-то случится, сообщите нам."]], "q": [{"q": "___ I known, I would have called you.", "o": ["Had", "Have", "Would"], "a": 0}, {"q": "___ you need any help, please call us.", "o": ["Should", "Would", "Have"], "a": 0}, {"q": "___ I in your place, I would apologise.", "o": ["Were", "Was", "Had"], "a": 0}, {"q": "___ you require assistance, please call.", "o": ["Should", "Would", "Had"], "a": 0}, {"q": "___ I known, I would have helped. (если бы знал)", "o": ["Had", "Would", "Did"], "a": 0}], "tbl": {"t": "Три модели", "head": ["С if", "Без if (инверсия)"], "rows": [["If I had known, …", "Had I known, …"], ["If I were you, …", "Were I you, …"], ["If you should ne var tabs=document.getElementById('tabs'),out=document.getElementById('out');
var P={},cur=0,canSpeak='speechSynthesis' in window;
try{P=JSON.parse(localStorage.getItem('progress')||'{}')||{}}catch(e){P={}}
function save(){try{localStorage.setItem('progress',JSON.stringify(P))}catch(e){}}
function eng(s){return s.split(';').map(function(x){return x.split('—')[0]}).join('. ').replace(/[«»→]/g,' ').replace(/[а-яёА-ЯЁ]+/g,' ').replace(/\s+/g,' ').trim()}
function speak(t){
  if(!canSpeak)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.9;
  var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang)})[0];
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function setBadge(ls){var b=P[ls.key];ls.badge.textContent=b==null?'':b+'/'+ls.q.length;ls.badge.className='badge'+(b===ls.q.length?' done':'')}
function refresh(){
  var done=0,total=0;
  L.forEach(function(l,k){
    var d=0;
    l.lessons.forEach(function(ls,n){if(P[l.id+'-'+n]===ls.q.length)d++});
    done+=d;total+=l.lessons.length;
    var s=tabs.children[k]&&tabs.children[k].querySelector('small');
    if(s)s.textContent=d+'/'+l.lessons.length;
  });
  document.getElementById('pt').textContent='Пройдено уроков без ошибок: '+done+' из '+total;
}
function hint(ls,w){if(w.querySelector('.hint'))return;w.appendChild(el('div','hint','<b>Подсказка:</b> '+ls.rule[0]))}
function record(ls,sc){if(!(P[ls.key]>=sc)){P[ls.key]=sc;save()}setBadge(ls);refresh();SK.task()}
(function(){
  var rst=document.getElementById('rst'),armed=false;
  rst.onclick=function(){
    if(!armed){armed=true;rst.textContent='Точно сбросить? Нажмите ещё раз';setTimeout(function(){armed=false;rst.textContent='Сбросить прогресс'},4000);return}
    P={};save();armed=false;rst.textContent='Сбросить прогресс';show(cur);refresh();
  };
})();
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function buildQuiz(ls,box,score){
  box.innerHTML='';score.innerHTML='';var sc=0,n=0;
  ls.q.forEach(function(q,k){
    var w=el('div','q','<p>'+(k+1)+'. '+q.q+'</p>'),row=el('div','opts');
    q.o.forEach(function(t,j){
      var b=el('button',null,t);b.type='button';
      b.onclick=function(){
        if(w.dataset.done)return;w.dataset.done=1;
        b.classList.add(j===q.a?'ok':'bad');
        if(j===q.a)sc++;else{row.children[q.a].classList.add('ok');hint(ls,w)}
        if(++n===ls.q.length){
          score.textContent='Результат: '+sc+' из '+n+(sc===n?' — отлично!':' — перечитайте правило и попробуйте ещё раз.');record(ls,sc);
          var r=el('button','again','Пройти заново');r.type='button';r.onclick=function(){buildQuiz(ls,box,score)};score.appendChild(r);
        }
      };
      row.appendChild(b);
    });
    w.appendChild(row);box.appendChild(w);
  });
}
function show(i){
  [].forEach.call(tabs.children,function(b,j){b.setAttribute('aria-pressed',j===i)});
  cur=i;var l=L[i];out.innerHTML='';
  out.appendChild(el('h2',null,l.id+' · '+l.name));out.appendChild(el('p','sub',l.d));
  l.lessons.forEach(function(ls,n){
    var d=el('details','lesson');if(n===0)d.open=true;
    ls.key=l.id+'-'+n;
    d.appendChild(el('summary',null,'<span class="num">'+(n+1)+'</span>'+ls.t+'<span class="badge"></span>'));
    ls.badge=d.querySelector('.badge');setBadge(ls);
    var b=el('div','body');
    b.appendChild(el('div','rule',ls.rule.map(function(r){return '<p>'+r+'</p>'}).join('')));
    if(ls.tbl){
      b.appendChild(el('h3',null,ls.tbl.t||'Как образуется'));
      var tw=el('div','tw'),tb=el('table');
      tb.appendChild(el('thead',null,'<tr>'+ls.tbl.head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>'));
      var tbd=el('tbody');ls.tbl.rows.forEach(function(r){tbd.appendChild(el('tr',null,r.map(function(c,i){return '<td>'+(i?'<i>'+c+'</i>':c)+'</td>'}).join('')))});
      tb.appendChild(tbd);tw.appendChild(tb);b.appendChild(tw);
    }
    if(ls.when){b.appendChild(el('h3',null,'Когда используем'));b.appendChild(el('ul','when',ls.when.map(function(w){return '<li>'+w+'</li>'}).join('')))}
    if(ls.extra){b.appendChild(el('h3',null,ls.extra.t));ls.extra.p.forEach(function(p){b.appendChild(el('p','extra',p))})}
    b.appendChild(el('h3',null,'Примеры'));
    var ul=el('ul','ex');
    ls.ex.forEach(function(x){
      var en=Array.isArray(x)?x[0]:x,ru=Array.isArray(x)?x[1]:'';
      var li=el('li',null,'<i></i>'),t=eng(en);li.firstChild.textContent=en;
      if(canSpeak&&t){var s=el('button','spk','🔊');s.type='button';s.title='Прослушать';s.setAttribute('aria-label','Прослушать: '+t);s.onclick=function(){speak(t)};li.appendChild(s)}
      if(ru){var r=el('div','tr');r.textContent=ru;li.appendChild(r)}
      ul.appendChild(li);
    });
    b.appendChild(ul);
    if(ls.mist){b.appendChild(el('h3',null,'Частые ошибки'));b.appendChild(el('ul','mist',ls.mist.map(function(m){return '<li>'+m+'</li>'}).join('')))}
    if(ls.tip)b.appendChild(el('div','tip','<b>Запомните:</b> '+ls.tip));
    b.appendChild(el('h3',null,'Проверьте себя'));
    var box=el('div'),score=el('div','score');score.setAttribute('role','status');
    b.appendChild(box);b.appendChild(score);buildQuiz(ls,box,score);
    d.appendChild(b);out.appendChild(d);
  });
}
L.forEach(function(l,i){var b=el('button',null,l.id+' <small></small>');b.type='button';b.onclick=function(){show(i)};tabs.appendChild(b)});
var h=(location.hash||'').slice(1),s0=0;L.forEach(function(l,k){if(l.id===h)s0=k});show(s0);refresh();

(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
  function label(){var d=isDark(),t=d?'Светлая тема':'Тёмная тема';btn.textContent=d?'☀️':'🌙';btn.setAttribute('aria-label',t);btn.title=t}
  try{var s=localStorage.getItem('theme');if(s)root.setAttribute('data-theme',s)}catch(e){}
  label();
  btn.addEventListener('click',function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}label()});
})();
</script>
